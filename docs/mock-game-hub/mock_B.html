<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:Iansui;src:url('file:///home/user/worksheet-backend/backend/fonts/Iansui-Regular.ttf')}
:root{--L0:#3f8f8a;--L1:#2f4d6e;--L2:#5a86ad;--L3:#e9f1f9;--bg:#f6f5f2;--card:#fff;--ink:#2b3440;--mute:#6b7683;--line:#e3e0d9;--ac:#e8863a;--ac-soft:#fdf0e3;--game:#ea580c}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Iansui,sans-serif;background:var(--bg);color:var(--ink);width:1280px;height:800px;overflow:hidden;position:relative}
.edgetabs{position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px}
.edgetab{writing-mode:vertical-rl;background:var(--L0);color:#fff;font-weight:800;letter-spacing:.25em;padding:16px 8px;border-radius:0 12px 12px 0;font-size:17px}
.edgetab.alt{background:var(--L1)}
.wrap{margin-left:56px;padding:22px 28px}

.tag{display:inline-block;background:var(--L3);color:var(--L1);border-radius:999px;padding:2px 12px;font-size:15px;font-weight:800}
.soon{filter:grayscale(1);opacity:.55}
.lvl{display:inline-flex;border:2px solid var(--ac);border-radius:12px;overflow:hidden}.lvl b{padding:6px 14px;font-size:17px;color:var(--ac)}.lvl b.on{background:var(--ac);color:#fff}
.mark{position:absolute;right:14px;bottom:10px;font-size:14px;color:#9ca3af}
</style><body><div class="edgetabs"><div class="edgetab">易數教室</div><div class="edgetab alt">互動學習單</div></div><div class="wrap"><h1>🎮 互動遊戲</h1><div class="sub">選一個遊戲</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px"><div class="" style="background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 4px 0 var(--line);outline:4px solid var(--game)"><img src="../../interactive/thumbs/game-breakfast-1.webp" style="height:170px;border-radius:12px;display:block"><div style="font-size:24px;font-weight:800;margin-top:8px">早餐店</div><span class="tag">錢幣＋四則</span></div><div class="soon" style="background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 4px 0 var(--line)"><div style="height:170px;aspect-ratio:1.6;border-radius:12px;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:42px">🏪</div><div style="font-size:24px;font-weight:800;margin-top:8px">文具店</div><span class="tag">錢幣＋加減</span></div><div class="soon" style="background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 4px 0 var(--line)"><div style="height:170px;aspect-ratio:1.6;border-radius:12px;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:42px">🏪</div><div style="font-size:24px;font-weight:800;margin-top:8px">水果攤</div><span class="tag">重量＋乘法</span></div></div></div><div style="position:absolute;inset:0;background:rgba(15,23,42,.35)"></div><div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:520px;background:var(--bg);border-radius:24px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.3)"><div style="display:flex;gap:14px;align-items:center;margin-bottom:12px"><img src="../../interactive/thumbs/game-breakfast-1.webp" style="height:80px;border-radius:12px;display:block"><div><div style="font-size:26px;font-weight:800">早餐店</div><div style="font-size:16px;color:var(--mute)">顧客點餐、算錢、付錢，店員找錢</div></div></div><div style="display:flex;align-items:center;gap:12px;border:3px solid var(--game);border-radius:14px;padding:10px 14px;margin-bottom:10px;background:#fff"><b style="font-size:20px;color:var(--game);white-space:nowrap">第 1 關</b><span style="font-size:19px;font-weight:800">買 1 樣</span><span style="font-size:15px;color:var(--mute);margin-left:auto">看價錢</span></div><div style="display:flex;align-items:center;gap:12px;border:3px solid var(--game);border-radius:14px;padding:10px 14px;margin-bottom:10px;background:#fff"><b style="font-size:20px;color:var(--game);white-space:nowrap">第 2 關</b><span style="font-size:19px;font-weight:800">買 2 樣</span><span style="font-size:15px;color:var(--mute);margin-left:auto">加法</span></div><div style="display:flex;align-items:center;gap:12px;border:3px solid var(--game);border-radius:14px;padding:10px 14px;margin-bottom:10px;background:#fff"><b style="font-size:20px;color:var(--game);white-space:nowrap">第 3 關</b><span style="font-size:19px;font-weight:800">同一樣買好幾個</span><span style="font-size:15px;color:var(--mute);margin-left:auto">乘法</span></div><div style="display:flex;align-items:center;gap:12px;border:3px solid var(--game);border-radius:14px;padding:10px 14px;margin-bottom:10px;background:#fff"><b style="font-size:20px;color:var(--game);white-space:nowrap">第 4 關</b><span style="font-size:19px;font-weight:800">綜合任務</span><span style="font-size:15px;color:var(--mute);margin-left:auto">先乘再加</span></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><span>提示：<span class="lvl"><b>強</b><b class="on">弱</b><b>無</b></span></span><span style="font-size:16px;color:var(--mute)">✕ 關閉</span></div></div><div class="mark">模擬圖 B：小卡片格子＋選關面板</div></body></html>
