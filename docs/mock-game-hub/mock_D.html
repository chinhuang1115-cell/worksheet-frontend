<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>

game);border-radius:10px;padding:2px 8px;font-size:15px;font-weight:800;background:#fff">3｜乘法</span><span style="border:2px solid var(--game);color:var(--game);border-radius:10px;padding:2px 8px;font-size:15px;font-weight:800;background:#fff">4｜先乘再加</span></div></div><div class="soon" style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px"><div style="height:160px;aspect-ratio:1.6;border-radius:12px;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:40px">🏪</div><div style="font-size:22px;font-weight:800;margin:8px 0 2px">文具店</div><div style="font-size:15px;color:var(--mute);margin-bottom:8px">（示意：即將推出）</div><div style="display:flex;flex-wrap:wrap;gap:6px"><span style="color:#9ca3af">即將推出</span></div></div><div class="soon" style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px"><div style="height:160px;aspect-ratio:1.6;border-radius:12px;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:40px">🏪</div><div style="font-size:22px;font-weight:800;margin:8px 0 2px">水果攤</div><div style="font-size:15px;color:var(--mute);margin-bottom:8px">（示意：即將推出）</div><div style="display:flex;flex-wrap:wrap;gap:6px"><span style="color:#9ca3af">即將推出</span></div></div></div></div></div><div class="mark">模擬圖 D：比照互動學習單總覽</div></body></html>
