<!doctype html><meta charset="utf-8">
<style>
body{margin:0;background:#fff;font-family:"Noto Sans CJK TC","Noto Sans TC",sans-serif;color:#222}
.page{width:900px;height:1190px;position:relative}

<div class="page" id="p"><div class="tag" id="tag"></div>
<div class="hd">單元：認識錢幣　　　姓名：<u>　　　　　　　　</u></div><div class="ins">數一數，一共多少元？</div><div class="ft">Mr. Huang's Math Class</div></div>
<script src="coin_geom.js"></script>
<script>
// 用法：?t=c（coincarry 至百位 L2，50 元）或 ?t=c10（coincarry10 至十位 L2，5 元）；&s=1.3 設 5 元放大倍率（相對 1 元直徑）
const U=new URLSearchParams(location.search),T=U.get('t')||'c',S5=parseFloat(U.get('s')||'1.3'),R=parseFloat(U.get('r')||'0'),MODE=U.get('m')||'free',OVP=parseFloat(U.get('o')||'0'),G=parseFloat(U.get('g')||(T=='c'?'6':'8'));
let seed=+(U.get('seed')||23);const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const W=330,H=196,RB=44,P=document.getElementById('p');
// 各版型：欄界 D、欄標、題目 [百,十,個]（特殊幣不含在內）
const CFG={
 c:{tag:'進位至百位 L2（加入50元）完全自由排列',D:[82,276],lab:[['100',0,'#c0504d'],['10',82,'#3a6fd0'],['1',276,'#666']],sp:50,
    Q:[[1,6,3],[2,10,4],[1,17,2],[3,12,5],[0,8,7],[2,15,6]]},
 c10:{tag:`進位至十位 L2（加入5元）完全自由排列（5元＝1元的${S5}倍）`,D:[101,178],lab:[['100',0,'#c0504d'],['10',101,'#3a6fd0'],['1',178,'#666']],sp:5,
    Q:[[1,3,6],[2,4,8],[1,2,5],[3,1,9],[2,5,7],[1,6,9]]}
}[T];
if(U.get('d')&&T=='c10')CFG.Q=[[2,2,6],[3,4,13],[2,3,12],[1,4,11],[3,1,13],[2,4,9]];
OVG.on=OVP>0;OVG.lim=OVP;document.getElementById('tag').textContent=CFG.tag.replace('完全自由排列',MODE=='semi'?'半自由排列（特殊幣固定在本位區左上）':'完全自由排列')+(MODE=='semi'?`｜區內縮 ${G} px`:'')+(OVP?`｜允許部分交疊（每對 ≤${OVP*100}%）`:'')+(R?`｜長方形幣傾斜 ±${R}°`:'');
const SPEC={100:{w:54,h:23},10:{w:30,h:30},1:{w:22,h:22},50:{w:37,h:37},5:{w:2*10*S5+2,h:2*10*S5+2}};
function mk(h,t,u){const it=[];
  it.push({k:CFG.sp});
  for(let i=0;i<h;i++)it.push({k:100});
  for(let i=0;i<t;i++)it.push({k:10});
  for(let i=0;i<u;i++)it.push({k:1});
  it.forEach(o=>{o.flag=OVG.on&&rnd()<0.6;o.ov=0;if(o.k!=100)o.cr={50:18.5,10:15,5:10*S5,1:10}[o.k];o.w=SPEC[o.k].w;o.h=SPEC[o.k].h;if(o.k==100){o.ang=(rnd()*2-1)*R;const t=Math.abs(o.ang)*Math.PI/180;o.ow=o.w;o.oh=o.h;o.w=o.ow*Math.cos(t)+o.oh*Math.sin(t);o.h=o.ow*Math.sin(t)+o.oh*Math.cos(t);}});return it;}
const circ=a=>a.k!=100;
const dist=(a,o)=>{if(circ(a)&&circ(o))return Math.hypot(a.x+a.w/2-o.x-o.w/2,a.y+a.h/2-o.y-o.h/2)-a.w/2-o.w/2;return Math.max(o.x-(a.x+a.w),a.x-(o.x+o.w),o.y-(a.y+a.h),a.y-(o.y+o.h));};
const KZ=T=='c'?{100:0,50:1,10:1,1:2}:{100:0,10:1,1:2,5:2};
const COLS=[[0,CFG.D[0]],[CFG.D[0],CFG.D[1]],[CFG.D[1],W]];
window.__ALL=[];function place(...q){const items=mk(...q);items.sort((a,b)=>b.w*b.h-a.w*a.h);
  for(let t=0;t<500;t++){items.forEach(a=>{a.x=undefined;a.ov=0;a._p=null});let good=true;
    if(MODE=='semi'){const sp=items.find(a=>a.k==CFG.sp);sp.x=COLS[KZ[sp.k]][0]+G+4;sp.y=6+4;}
    for(const a of items){if(a.x!==undefined)continue;
      let x0=6,x1=W-6;if(MODE=='semi'){const c=COLS[KZ[a.k]];x0=c[0]+G;x1=c[1]-G;}
      let ok=false,n=0;
      while(!ok&&n++<3000){propose(a,items,x0,x1,6,H-6,n,rnd);const ck=checkPos(a,items,dist,5);ok=ck.ok;if(ok&&ck.partner){a._p=ck.partner}else a._p=null;}
      if(ok&&a._p){a.ov=1;a._p.ov=1;}
      if(!ok){good=false;break;}}
    if(good){window.__ALL.push(items);return items;}}
  throw 'full';}
function coin(a){const cx=a.x+a.w/2,cy=a.y+a.h/2;
  if(a.k==100){const ox=cx-a.ow/2,oy=cy-a.oh/2;return `<g transform="rotate(${(a.ang||0).toFixed(2)} ${cx} ${cy})"><rect x="${ox}" y="${oy}" width="${a.ow}" height="${a.oh}" fill="#F9DCDC" stroke="#222" stroke-width="1.8"/><rect x="${ox+3}" y="${oy+3}" width="${a.ow-6}" height="${a.oh-6}" fill="none" stroke="#BDBDBD" stroke-width="1"/><text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1" fill="#8E1B1B">100</text></g>`;}
  const R={50:18.5,10:15,5:10*S5,1:10}[a.k],sw={50:2.2,10:1.8,5:2,1:1.4}[a.k],fs={50:19,10:15,5:14,1:13}[a.k];
  return `<circle cx="${cx}" cy="${cy}" r="${R}" fill="#fff" stroke="#222" stroke-width="${sw}"/>${a.k==1?'':`<circle cx="${cx}" cy="${cy}" r="${R-3.7}" fill="none" stroke="#BDBDBD" stroke-width="1"/>`}<text x="${cx}" y="${cy+fs*0.36}" text-anchor="middle" font-size="${fs}">${a.k}</text>`;}
function box(items,demo){const D=CFG.D;
  let s=`<svg width="${W}" height="${H+RB}" style="display:block;overflow:visible"><rect x="0" y="0" width="${W}" height="${H+RB}" fill="none" stroke="#888" stroke-width="1.5"/><line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="#888" stroke-width="1.5"/>`;
  D.forEach(x=>s+=`<line x1="${x}" y1="${H}" x2="${x}" y2="${H+RB}" stroke="#888" stroke-dasharray="6 4"/>`);
  CFG.lab.forEach(l=>s+=`<text x="${l[1]+6}" y="${H+14}" font-size="11" fill="${l[2]}">${l[0]}</text>`);
  if(demo){const c=[D[0]/2,(D[0]+D[1])/2,(D[1]+W)/2],[hh,tt,uu]=demo.q;
    let a,b,cc;
    if(T=='c'){const tens=5+tt;a=`<tspan text-decoration="line-through">${hh}</tspan> <tspan fill="#c97a2b">${hh+1}</tspan>`;b=`<tspan text-decoration="line-through">${tens}</tspan> <tspan fill="#c97a2b">${tens%10}</tspan>`;cc=`${uu}`;}
    else{const ones=5+uu;a=`${hh}`;b=`<tspan text-decoration="line-through">${tt}</tspan> <tspan fill="#c97a2b">${tt+1}</tspan>`;cc=`<tspan text-decoration="line-through">${ones}</tspan> <tspan fill="#c97a2b">${ones%10}</tspan>`;}
    [a,b,cc].forEach((t,i)=>s+=`<text x="${c[i]}" y="${H+33}" text-anchor="middle" font-size="20">${t}</text>`);}
  return s+items.map(coin).join('')+'</svg>';}
CFG.Q.forEach((q,i)=>{const d=document.createElement('div');d.className='q';
  d.style.left=(i%2?526:106)+'px';d.style.top=(150+Math.floor(i/2)*320)+'px';
  const tot=q[0]*100+q[1]*10+q[2]+CFG.sp;
  d.innerHTML=`<b>${i+1}.</b>`+box(place(...q),i==0?{q}:null)+`<div class="ans">一共是(${i==0?' '+tot+' ':'　　　　　　'})元</div>`;
  P.appendChild(d);});
// 統計：實際交疊的幣對數與最大交疊比例（供驗證）
{const ST={q:0,pairs:0,max:0,hid:0,coins:0,bad:0};
 (window.__ALL||[]).forEach(items=>{ST.q++;ST.coins+=items.length;
  for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){const A=_sh(items[i]),B=_sh(items[j]);const f=Math.max(_frac(A,B),_frac(B,A));
   if(f>0){ST.pairs++;ST.max=Math.max(ST.max,f);if(f>OVG.lim+1e-9)ST.bad++;if(_labelHit(A,B)||_labelHit(B,A))ST.hid++}}});
 const d=document.createElement('div');d.id='stat';d.style.display='none';d.textContent=JSON.stringify(ST);document.body.appendChild(d);}

</script>
