<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
body{background:#fdf8ec;width:1280px;height:800px}
.lay{display:flex;gap:10px;padding:10px;height:690px}
.side{width:400px;background:#fff7ed;border:4px solid #fb923c;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.cen{flex:1;display:flex;flex-direction:column;gap:8px}
.board{background:#cbb89a;border:3px solid #8b5a2b;border-radius:10px;padding:3px;display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.item{background:#fff;border-radius:7px;display:flex;flex-direction:column;align-items:center;padding:4px}
.item img{height:52px}.item .nm{font-size:16px;font-weight:800}
.tag{border:2px solid #a855f7;color:#7e22ce;border-radius:8px;padding:0 6px;font-size:14px;font-weight:800}
.tag.big{background:#fef08a;border-color:#ca8a04;color:#854d0e;font-size:16px}
.item.combo{box-shadow:0 0 0 4px #f59e0b inset}
.ctr{flex:1;background:linear-gradient(#d6a76c,#c08a4c);border-top:9px solid #8b5a2b;border-radius:8px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:16px}
.tray{width:56%;height:120px;border-radius:22px;background:#f8fafc;border:6px solid #e2e8f0;box-shadow:0 12px 0 #cbd5e1;display:flex;align-items:center;justify-content:center;gap:8px}
.tray img{height:80px}
.card{background:#fff;border:3px solid #ea580c;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.sh{font-size:20px;font-weight:800;display:flex;gap:8px;align-items:center}.sh .n{background:#ea580c;color:#fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.sh .sub{font-weight:500;color:#78716c;font-size:.9em}
.task{background:#fefce8;border:2px dashed #eab308;border-radius:12px;padding:6px 12px;font-size:21px;font-weight:800}
.task .it{display:flex;align-items:center;gap:6px;font-size:23px;margin:8px 0 4px}.task img{height:44px}
.eq{font-size:32px;font-weight:800;display:flex;align-items:center;gap:8px}
.box{display:inline-flex;align-items:center;justify-content:center;min-width:80px;height:52px;border:3px dashed #fdba74;border-radius:12px;background:#fff7ed;color:#9a3412}
.box.ok{border:3px solid #16a34a;background:#dcfce7;color:#15803d}
.btnc{align-self:flex-start;background:#ea580c;color:#fff;border-radius:14px;padding:8px 18px;font-size:21px;font-weight:800;border-bottom:5px solid #9a3412}
.lbl{position:absolute;top:8px;right:16px;background:#1f2937;color:#fff;font-size:18px;font-weight:800;padding:4px 12px;border-radius:8px}
.npc{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid #a3e635;border-radius:14px;padding:8px}
.npc .em{font-size:44px}.npc .bub{border:3px solid #65a30d;color:#3f6212;border-radius:14px;padding:4px 10px;font-size:18px;font-weight:800}
.note{font-size:16px;color:#57534e;background:#fff;border-radius:10px;padding:6px 10px;border:2px solid #e7e5e4}
.done{color:#78716c;font-size:24px}
