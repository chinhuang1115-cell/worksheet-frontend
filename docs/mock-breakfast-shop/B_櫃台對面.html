<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.wrap{display:flex;gap:16px;padding:14px 40px 0}
.scene{width:780px;height:660px;border-radius:16px;overflow:hidden;border:3px solid #cbd5e1;display:flex;flex-direction:column}
.zone{padding:10px 16px;position:relative}
.zclk{background:#eff6ff;height:250px;border-bottom:0}
.zcus{background:#fff7ed;height:190px;opacity:.55}
.zone .who{font-size:20px;font-weight:800;display:flex;align-items:center;gap:6px}
.zclk .who{color:#1d4ed8}.zcus .who{color:#c2410c}
.till{display:flex;gap:8px;margin-top:8px}
.till .dr{flex:1;height:170px;background:#fff;border:3px solid #93c5fd;border-radius:10px;display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:2px}
.till .dr i{font-style:normal;font-size:14px;color:#64748b;font-weight:700}
.counter{height:220px;background:linear-gradient(#d6a76c,#c08a4c);border-top:8px solid #8b5a2b;border-bottom:8px solid #8b5a2b;display:flex;align-items:center;justify-content:space-around;padding:0 20px}
.mat{background:#fff;border-radius:50%/42%;width:300px;height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:4px solid #fff;box-shadow:inset 0 0 0 4px #e5e7eb}
.mat h5{margin:0 0 6px;font-size:18px}
.mat.chg{border:4px dashed #2563eb;box-shadow:none}
.order{background:#fff;border-radius:6px;padding:6px 10px;font-size:17px;font-weight:700;width:140px;transform:rotate(-3deg);box-shadow:2px 3px 0 rgba(0,0,0,.15)}
.right{flex:1}
.vh{font-size:40px;font-weight:800;display:flex;align-items:center;gap:10px;margin:16px 0}
.float{background:#eff6ff;border:2px solid #60a5fa;border-radius:12px;padding:8px 12px;font-size:18px;margin-top:14px}
</style></head><body>
<div class="top"><div class="l"><span class="qno">第 1 回 / 3</span><span class="th">早餐店</span><span class="ttl">早餐店購物（第 2 關：買兩樣）</span><span class="stars">★☆☆</span></div>
<div class="role clk"><span class="av">🧑‍🍳</span>現在是：店員</div>
<div class="r"><div class="seg"><span class="on">強提示</span><span>弱提示</span><span>無提示</span></div><span class="btn">語速：普通</span><span class="btn">🗣</span><span class="btn">🔔</span></div></div>
<div class="label">模擬圖 B：櫃台對面（上店員、下顧客）</div>
<div class="wrap">
 <div class="scene">
  <div class="zone zclk"><div class="who">🧑‍🍳 店員的收銀機</div>
   <div class="till">
    <div class="dr" data-coins="h h" data-s=".8"><i>100 元</i></div>
    <div class="dr" data-coins="q q" data-s=".8"><i>50 元</i></div>
    <div class="dr" data-coins="t t t" data-s=".7"><i>10 元</i></div>
    <div class="dr" data-coins="f f f" data-s=".7"><i>5 元</i></div>
    <div class="dr" data-coins="o o o" data-s=".7"><i>1 元</i></div>
   </div></div>
  <div class="counter">
   <div class="order">點餐單<br>🍔 漢堡 35 元<br>🧋 奶茶 20 元<br>一共 55 元</div>
   <div class="mat"><h5>顧客付的錢</h5><div data-coins="h"></div></div>
   <div class="mat chg"><h5>找給顧客的錢</h5><div data-coins="t t t t f"></div></div>
  </div>
  <div class="zone zcus"><div class="who">🙋 顧客的錢包（等一下輪到顧客）</div><div data-coins="q t t t f o o o o" style="display:flex;gap:6px;margin-top:8px;align-items:center"></div></div>
 </div>
 <div class="right card step" style="border-color:#2563eb">
  <div class="prog"><span class="done">點餐</span><span class="done">結帳</span><span class="done">付錢</span><span class="clk now">⑤ 找錢</span><span>點收</span></div>
  <div class="sh clk"><span class="n">5</span>找錢：要找給顧客多少元？</div>
  <div class="vh">100 － 55 ＝ <span class="dz" style="border-color:#93c5fd;background:#eff6ff;color:#1d4ed8">45</span> 元</div>
  <div class="float">💡 算好了，從收銀機拿 <b>45 元</b> 放到藍色盤子。</div>
  <div style="margin-top:16px" class="keypad"><span>7</span><span>8</span><span>9</span><span class="op">＋</span><span>4</span><span>5</span><span>6</span><span class="op">－</span><span>1</span><span>2</span><span>3</span><span class="op">⌫</span><span class="z">0</span></div>
 </div>
</div>
