<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
body{background:#e7e5e4;height:auto;padding:18px}
h1{margin:0 0 12px;font-size:26px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cell{background:#fff;border-radius:14px;padding:10px 12px;border:3px solid #a8a29e}
.cap{font-size:22px;margin-bottom:8px} .cap b{background:#1f2937;color:#fff;border-radius:8px;padding:0 10px;margin-right:6px} .cap small{display:block;font-size:15px;color:#57534e;margin-top:4px}
.ctr{background:linear-gradient(#d6a76c,#c08a4c);border-top:9px solid #8b5a2b;border-radius:8px;padding:18px 14px;display:flex;gap:14px;align-items:center}
.slip{background:#fff;border-radius:6px;padding:5px 10px;font-size:16px;transform:rotate(-2deg);box-shadow:2px 3px 0 rgba(0,0,0,.15);min-width:110px}
.ctr img{height:58px}
.tA{flex:1;height:92px;display:flex;align-items:center;justify-content:center;gap:10px;position:relative;border-radius:14px;border:7px solid #92400e;background:repeating-linear-gradient(90deg,#f3d6a4 0 26px,#eccb92 26px 30px);box-shadow:inset 0 3px 6px rgba(0,0,0,.18),0 4px 0 #6b2f0a}
.tA::before,.tA::after{content:'';position:absolute;top:50%;translate:0 -50%;width:10px;height:34px;border-radius:6px;background:#5b2508} .tA::before{left:-2px} .tA::after{right:-2px}
.tB{flex:1;height:96px;border-radius:16px;background:#dc2626;padding:9px 14px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 5px 0 #991b1b}
.tB .mat{height:100%;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:10px;background:#fffbeb;background-image:radial-gradient(#fcd34d 2px,transparent 2.5px);background-size:16px 16px;border:2px dashed #f59e0b}
.tC{flex:1;position:relative;margin:0 22px}
.tC .in{height:90px;border-radius:22px;background:#f8fafc;border:6px solid #e2e8f0;box-shadow:inset 0 6px 10px rgba(0,0,0,.10),0 6px 0 #cbd5e1;display:flex;align-items:center;justify-content:center;gap:10px;position:relative;z-index:1}
.tC .ear{position:absolute;top:50%;translate:0 -50%;width:40px;height:44px;background:#e2e8f0;border-radius:14px;box-shadow:0 5px 0 #cbd5e1} .tC .ear::after{content:'';position:absolute;top:13px;width:16px;height:18px;border-radius:8px;background:#c08a4c}
.tC .ear.l{left:-26px} .tC .ear.l::after{left:6px} .tC .ear.r{right:-26px} .tC .ear.r::after{right:6px}
.tD{flex:1;perspective:500px}
.tD .top{height:100px;border-radius:16px;background:linear-gradient(#fdba74,#fb923c);border:6px solid #ea580c;transform:rotateX(28deg);transform-origin:bottom;box-shadow:0 14px 0 #c2410c,0 22px 18px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;gap:10px}
.tD .top img{transform:rotateX(-28deg) translateY(-8px)}
.now{margin-top:16px}
