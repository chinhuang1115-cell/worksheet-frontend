<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>入店動畫模擬</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#3b2f2a;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:#fff}
#bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px}
#bar b{font-size:18px;margin-right:6px}
#bar button{font:inherit;font-size:17px;font-weight:800;border:0;border-radius:12px;padding:8px 14px;background:#fff;color:#9a3412;cursor:pointer;border-bottom:4px solid #fdba74}
#bar button.on{background:#ea580c;color:#fff;border-bottom-color:#9a3412}
#note{padding:0 12px 8px;font-size:15px;color:#fde68a;min-height:22px}
#wrap{width:100%;overflow:hidden}
#stage{position:relative;width:1024px;height:768px;overflow:hidden;transform-origin:0 0;background:#fff7ed}
#stage img.bg{position:absolute;left:0;top:0;width:1024px;height:768px}
#full{opacity:0;transition:opacity .5s}
.p{position:absolute;left:0;top:0;transform-origin:50% 100%;will-change:transform}
.p svg{display:block;width:100%;height:100%}
.bub{position:absolute;background:#fff;border:3px solid #ea580c;border-radius:16px;padding:6px 14px;font-size:22px;font-weight:800;color:#9a3412;opacity:0;transform:scale(.6);transition:opacity .25s,transform .25s;white-space:nowrap}
.bub.clk{border-color:#3b82f6;color:#1d4ed8}.bub.show{opacity:1;transform:none}
.cover{position:absolute;inset:0;overflow:hidden}
.front{background:linear-gradient(#fde8c8 0 62%,#c9b08a 62% 64%,#a8a29e 64%)}
.front .aw{position:absolute;left:0;right:0;top:0;height:120px;background:repeating-linear-gradient(90deg,#dc2626 0 64px,#fff 64px 128px);border-bottom:10px solid #7c2d12;border-radius:0 0 26px 26px}
.front .sg{position:absolute;left:50%;top:136px;transform:translateX(-50%);background:#7c2d12;color:#fde68a;border:5px solid #f59e0b;border-radius:16px;font-size:38px;font-weight:900;padding:6px 30px;white-space:nowrap}
.front .dr{position:absolute;left:412px;top:232px;width:200px;height:262px;background:#451a03;border:8px solid #7c2d12;border-radius:12px 12px 0 0;overflow:hidden}
.front .dr i{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(135deg,#bae6fd,#e0f2fe 45%,#7dd3fc);border:4px solid #7c2d12;transition:transform .7s ease-in-out}
.front .dr i:first-child{left:0}.front .dr i:last-child{right:0}
.front.open .dr i:first-child{transform:translateX(-96%)}.front.open .dr i:last-child{transform:translateX(96%)}
.front .wn{position:absolute;top:262px;width:230px;height:150px;background:#bae6fd;border:8px solid #7c2d12;border-radius:10px}
.front .bell{position:absolute;left:626px;top:222px;font-size:40px;transform-origin:50% 0}
.ring{animation:ring .5s 2}@keyframes ring{25%{transform:rotate(22deg)}75%{transform:rotate(-22deg)}}
.doors i{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(135deg,rgba(186,230,253,.96),rgba(224,242,254,.96) 45%,rgba(125,211,252,.96));border:10px solid #7c2d12;transition:transform 1s ease-in-out;display:flex;align-items:center}
.doors i:first-child{left:0;justify-content:flex-end}.doors i:last-child{right:0;justify-content:flex-start}
.doors i span{font-style:normal;font-size:56px;font-weight:900;color:#7c2d12;padding:0 14px}
.doors.open i:first-child{transform:translateX(-101%)}.doors.open i:last-child{transform:translateX(101%)}
.fade{transition:opacity .6s,transform .9s ease-in}.gone{opacity:0;transform:scale(1.6)}
.card{position:absolute;left:24px;top:184px;width:338px;height:200px;border:3px solid #ea580c;border-radius:14px;background:#fff;opacity:0}
</style></head><body>
<div id="bar"><b>入店動畫模擬</b><button data-v="A">甲　從店門口走進來</button><button data-v="B">乙　自動門打開</button><button data-v="C">丙　走到櫃台前</button><button id="re">↻ 再播一次</button></div>

const wait=(ms,t)=>new Promise((r,j)=>setTimeout(()=>t===tok?r():j('x'),ms));
function ding(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); [[784,0],[622,.28]].forEach(([f,d])=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(.0001,AC.currentTime+d); g.gain.exponentialRampToValueAtTime(.25,AC.currentTime+d+.02); g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d+.7); o.connect(g); g.connect(AC.destination); o.start(AC.currentTime+d); o.stop(AC.currentTime+d+.75); }); }catch(e){} }
function el(cls,html,css){ const d=document.createElement('div'); d.className=cls; if(html) d.innerHTML=html; if(css) d.style.cssText=css; fx.appendChild(d); return d; }
function person(svg,w,h){ const d=el('p',svg); d.style.width=w+'px'; d.style.height=h+'px'; return d; }
const put=(d,x,y,s=1)=>{ d.style.transform=`translate(${x}px,${y}px) scale(${s})`; };
function walk(d,x0,x1,y,ms,s=1){ const steps=Math.max(4,Math.round(ms/260)); const kf=[]; for(let i=0;i<=steps;i++){ const f=i/steps; kf.push({transform:`translate(${x0+(x1-x0)*f}px,${y-(i%2?10:0)}px) rotate(${i%2?3:-3}deg) scale(${s})`}); } kf[steps].transform=`translate(${x1}px,${y}px) scale(${s})`; return d.animate(kf,{duration:ms,fill:'forwards',easing:'linear'}).finished; }
function fly(d,from,to,ms){ return d.animate([{transform:`translate(${from.x}px,${from.y}px) scale(${from.s})`},{transform:`translate(${to.x}px,${to.y}px) scale(${to.s})`}],{duration:ms,fill:'forwards',easing:'ease-in-out'}).finished; }
function clerk(){ const c=person(CLK,CSL.w,CSL.h); put(c,CSL.x,CSL.y); return c; }
function greet(){ const b=el('bub clk','歡迎光臨！','right:168px;top:128px'); requestAnimationFrame(()=>b.classList.add('show')); return b; }
async function finish(t,c){ await wait(500,t); full.style.opacity=1; fx.querySelectorAll('.p').forEach(x=>{x.style.transition='opacity .5s';x.style.opacity=0}); await wait(600,t); note.textContent='→ 接著出現任務卡，開始點餐。'; }
const V={
 async A(t){ note.textContent='甲：先看到店門口 → 顧客走到門前 → 叮咚、門打開 → 進到店裡，店員說「歡迎光臨！」（約 5 秒）';
  clerk(); const f=el('cover front fade','<div class="aw"></div><div class="sg">美而好早餐店</div><div class="wn" style="left:110px"></div><div class="wn" style="right:110px"></div><div class="dr"><i></i><i></i></div><div class="bell">🔔</div>');
  const c=person(CUS,150,165); put(c,-170,340); await wait(400,t);
  await walk(c,-170,437,340,1900); if(t!==tok) return; f.querySelector('.bell').classList.add('ring'); ding(); await wait(500,t);
  f.classList.add('open'); await wait(800,t);
  c.animate([{transform:'translate(437px,340px) scale(1)',opacity:1},{transform:'translate(437px,300px) scale(.72)',opacity:0}],{duration:600,fill:'forwards'}); await wait(500,t);
  f.classList.add('gone'); await wait(700,t); f.remove();
  put(c,SLOT.x-47,SLOT.y-113,1); c.getAnimations().forEach(a=>a.cancel()); c.style.width=SLOT.w+'px'; c.style.height=SLOT.h+'px'; put(c,SLOT.x,SLOT.y); c.animate([{transform:`translate(${SLOT.x}px,${SLOT.y}px) scale(.2)`},{transform:`translate(${SLOT.x}px,${SLOT.y}px) scale(1.25)`},{transform:`translate(${SLOT.x}px,${SLOT.y}px) scale(1)`}],{duration:450});
  greet(); await finish(t,c); },
 async B(t){ note.textContent='乙：整個畫面是兩片玻璃門 → 叮咚、門往兩邊滑開 → 顧客已經站在位置上，店員說「歡迎光臨！」（約 3 秒）';
  clerk(); const c=person(CUS,SLOT.w,SLOT.h); put(c,SLOT.x,SLOT.y);
  const d=el('cover doors','<i><span>歡迎</span></i><i><span>光臨</span></i>'); await wait(700,t); ding(); await wait(400,t);
  d.classList.add('open'); await wait(1100,t); d.remove();
  c.animate([{transform:`translate(${SLOT.x}px,${SLOT.y}px) scale(1)`},{transform:`translate(${SLOT.x}px,${SLOT.y-14}px) scale(1.2)`},{transform:`translate(${SLOT.x}px,${SLOT.y}px) scale(1)`}],{duration:500});
  greet(); await finish(t,c); },
 async C(t){ note.textContent='丙：不蓋畫面 → 叮咚，顧客從左邊走到櫃台前 → 店員說「歡迎光臨！」→ 顧客回到左上角自己的位置（約 4.5 秒）';
  clerk(); const c=person(CUS,150,165); put(c,-170,330); await wait(300,t); ding();
  await walk(c,-170,520,330,2200); if(t!==tok) return; const g=greet(); await wait(1100,t);
  const s=SLOT.w/150; await fly(c,{x:520,y:330,s:1},{x:SLOT.x-47,y:SLOT.y-113,s:s},800); if(t!==tok) return;
  await finish(t,c); }
};
async function play(v){ cur=v; const t=++tok; fx.innerHTML=''; full.style.transition='none'; full.style.opacity=0; void full.offsetWidth; full.style.transition='';
  document.querySelectorAll('#bar button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  try{ await V[v](t); }catch(e){ if(e!=='x') throw e; } }
document.querySelectorAll('#bar button[data-v]').forEach(b=>b.onclick=()=>play(b.dataset.v));
document.getElementById('re').onclick=()=>play(cur);
function fit(){ const s=Math.min(1,document.getElementById('wrap').clientWidth/1024), st=document.getElementById('stage'); st.style.transform=`scale(${s})`; document.getElementById('wrap').style.height=768*s+'px'; }
addEventListener('resize',fit); fit(); window.play=play;
</script></body></html>
