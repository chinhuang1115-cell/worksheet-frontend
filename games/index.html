<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>互動遊戲小鎮</title>
<!-- 互動遊戲導覽頁「小鎮地圖」。2026-11-18 起改成「半圓三扇」（價位街區批次 Z1，docs/價位街區_規劃.md）：入口在下方中央，往上展開成半圓、切三片 60° 扇形，
     左＝巷口小街（100 元以內）、中＝熱鬧大街（1000 元以內）、右＝百貨商場（10000 元以內）；兩條交界靠入口處各一間銀行（還不能點）。
     店的位置不再手填：依各扇區的形狀自動排開（layoutZone：貪婪取點＋微調，店牌不重疊、不出扇形；放不下就把整張地圖的店一起縮小）。
     新增店＝catalog 的 kind:'game' 加一筆（district 預設 100）；規劃中的店寫進下面的 PLACES；解鎖街區＝改 LOCKED。
     （2026-11-15 的舊版：參考繪本地圖，一條彎彎的主街、店散在路兩邊。）
     2026-11-10～11-14 是「商店街」版（模擬圖 C），右側欄選關卡與提示強弱的做法沿用。
     資料讀 dashboard/catalog.json 的 kind:'game' 項目（shop／tag／desc／stages）：新增遊戲只要加一筆資料＋重產縮圖。
     店的外觀（emoji、雨棚色）查下面的 LOOK 表（以 shop 店名對應，查不到用預設外觀）。
     PLACES＝各街區規劃中的店與買票場所（灰色「即將開幕」）；上線後同街區的 catalog 有同名 shop 就自動變彩色。模擬圖 docs/mock-district-map/。 -->
<style>
@font-face{font-family:"芫荽";src:url('../fonts/Iansui-Regular.ttf') format('truetype');font-display:swap}
:root{--L0:#3f8f8a;--L1:#2f4d6e;--bg:#f6f5f2;--card:#fff;--ink:#2b3440;--mute:#6b7683;--line:#e3e0d9;--ac:#e8863a;--game:#ea580c;--game-ink:#c2410c;--h1:#2f4d6e;--frame:#3b2f2f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--L0:#3a8a86;--L1:#27405c;--bg:#1d2128;--card:#272c35;--ink:#e8eaee;--mute:#9aa4b1;--line:#3a414d;--ac:#f09a55;--game:#f97316;--game-ink:#fdba74;--h1:#dbe7f3;--frame:#0f1115}}
:root[data-theme="dark"]{--L0:#3a8a86;--L1:#27405c;--bg:#1d2128;--card:#272c35;--ink:#e8eaee;--mute:#9aa4b1;--line:#3a414d;--ac:#f09a55;--game:#f97316;--game-ink:#fdba74;--h1:#dbe7f3;--frame:#0f1115}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "芫荽","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
/* 左側邊緣直式標籤（與互動學習單總覽同款）：回易數教室、到互動學習單 */
.edgetabs{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.edgetab{display:block;flex:none;height:max-content;writing-mode:vertical-rl;background:var(--L0);color:#fff;text-decoration:none;font-weight:800;letter-spacing:.25em;padding:16px 8px;border-radius:0 12px 12px 0;box-shadow:2px 2px 8px rgba(0,0,0,.2);font-size:16px}
.edgetab.ws{background:var(--L1)}.edgetab:hover{filter:brightness(1.12)}
.page{display:grid;grid-template-columns:minmax(0,1fr) 320px;height:100vh}
main{padding:14px 14px 14px 56px;display:flex;flex-direction:column;min-width:0;min-height:0}
h1{margin:0;font-size:28px;color:var(--h1)}
.sub{color:var(--mute);font-size:16px;margin-bottom:8px}
/* 地圖：插畫本身固定用亮色（像一張紙本地圖），深色模式只換外框與頁面 */
.map{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center}
.map svg{display:block;max-width:100%;max-height:100%;border-radius:22px;border:4px solid var(--frame);box-shadow:0 6px 0 rgba(0,0,0,.12);background:#dcfce7}
.map svg text{font-family:"芫荽","Noto Sans TC",sans-serif}
.shop{cursor:pointer;outline:none}
.shop .lift{transition:transform .2s}
.shop:hover .lift{transform:translateY(-6px)}
.shop .ring{fill:none;stroke:transparent;stroke-width:6}
.shop.on .ring{stroke:var(--game)}
.shop:focus-visible .ring{stroke:var(--ac);stroke-dasharray:10 6}
.shop .lb{fill:#fff}.shop .lbt{fill:#2b3440}
.shop.on .lb{fill:#ea580c}.shop.on .lbt{fill:#fff}
.shop.soon{cursor:default}.shop.soon .lb{fill:#f3f4f6}.shop.soon .lbt{fill:#6b7683}
.shop.soon:hover .lift{transform:none}
/* 右側欄：選中的店、關卡、提示強弱 */
aside{background:var(--bg);border-left:4px solid var(--game);padding:18px;overflow:auto}
aside .nm{font-size:26px;font-weight:800}
aside .ds{font-size:16px;color:var(--mute);margin-bottom:10px}
.stage{display:block;text-decoration:none;color:inherit;border:3px solid var(--game);border-radius:14px;padding:8px 14px;margin-bottom:9px;background:var(--card);border-bottom-width:6px}
.stage:hover{filter:brightness(1.04)}.stage:active{translate:0 2px;border-bottom-width:4px}
.stage b{font-size:19px;color:var(--game-ink)}.stage span{font-size:19px;font-weight:800;margin-left:10px}
.stage small{display:block;font-size:15px;color:var(--mute)}
.lvlrow{display:flex;align-items:center;gap:8px;margin:4px 0 12px;font-size:17px}
.lvl{display:inline-flex;border:2px solid var(--ac);border-radius:12px;overflow:hidden}
.lvl button{border:0;background:none;font:inherit;font-size:17px;font-weight:800;color:var(--ac);padding:6px 14px;cursor:pointer}
.lvl button.on{background:var(--ac);color:#fff}
.empty{color:var(--mute);padding:40px 0}
/* 手機：地圖上的店名太小，地圖下面另外給一排店名按鈕（依街區分組；鎖住的街區按鈕灰色不能點） */
.chips{display:none;flex-direction:column;gap:10px;margin-top:10px}
.chips .gt{font-size:16px;font-weight:800;color:var(--mute);margin-bottom:4px}
.chips .row{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:inherit;font-size:17px;font-weight:800;border:3px solid var(--game);border-radius:999px;background:var(--card);color:var(--ink);padding:4px 14px;cursor:pointer}
.chips button.on{background:var(--game);color:#fff}
.chips button:disabled{border-color:#cbd5e1;background:#f1f5f9;color:#94a3b8;cursor:not-allowed}
@media (max-width:600px){.chips{display:flex}}
/* 平板／窄螢幕（≤1100px）：關卡欄移到地圖下方，地圖用滿整個寬度；左＝店名＋說明＋提示強弱，右＝關卡 3 欄格狀 */
@media (max-width:1100px){.page{grid-template-columns:1fr;height:auto}main{padding:10px 12px 10px 46px}h1{font-size:24px}.sub{margin-bottom:4px}
  .map svg{width:100%;max-height:none;height:auto}
  aside{border-left:0;border-top:4px solid var(--game);padding:16px 16px 20px 50px;display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:8px 22px;align-items:start}
  .stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .stage{min-height:56px;margin-bottom:0;padding:8px 12px}.stage b,.stage span{font-size:18px}.stage span{margin-left:8px}}
/* 手機：關卡欄上下堆疊、關卡一欄 */
@media (max-width:600px){aside{display:block;padding:16px 16px 18px 50px}.stages{grid-template-columns:1fr}.stage{margin-bottom:9px}}
</style>
</head>
<body>
<div class="edgetabs"><a class="edgetab" href="../" title="回易數教室">易數教室</a><a class="edgetab ws" href="../interactive/" title="互動學習單">互動學習單</a></div>
<div class="page">
  <main>
    <h1>🗺️ 互動遊戲小鎮</h1>
    <div class="sub">點一間店，選一個關卡開始玩（灰色的街區還沒開放）</div>
    <div class="map" id="map"><div class="empty">載入中…</div></div>
    <div class="chips" id="chips"></div>
  </main>
  <aside id="side"></aside>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LV=[{id:3,name:'強',mode:'full'},{id:2,name:'弱',mode:'faded'},{id:1,name:'無',mode:'free'}];
/* 店的外觀：emoji、雨棚兩色、牆色（雨棚色照 docs/商店街新增店家_規劃.md 的裝潢配色）；買票的場所另用圓頂屋頂區分 */
const LOOK={'早餐店':['🍳','#ef4444','#fff','#fff7ed'],'麵包店':['🥐','#f472b6','#fff','#fdf2f8'],'文具店':['✏️','#38bdf8','#fff','#eff6ff'],
  '糖果餅乾店':['🍭','#c084fc','#fff','#faf5ff'],'飲料店':['🧋','#34d399','#fff','#ecfdf5'],'玩具店':['🪀','#ef4444','#facc15','#fefce8'],
  '便當店':['🍱','#f97316','#fff','#fff7ed'],'中式餐館':['🥢','#dc2626','#fbbf24','#fef3c7'],'服飾店':['🧦','#fb7185','#9ca3af','#fff1f2'],
  '鞋店':['👟','#a78bfa','#fff','#f5f3ff'],'書店':['📚','#0d9488','#fff','#f0fdfa'],'運動用品店':['⚽','#22c55e','#fff','#f0fdf4'],'水果行':['🍎','#ef4444','#fde68a','#fef2f2'],
  '家電行':['📺','#64748b','#fff','#f1f5f9'],'腳踏車店':['🚲','#16a34a','#fff','#f0fdf4'],'電腦用品店':['💻','#0ea5e9','#fff','#f0f9ff'],'家具行':['🛋️','#b45309','#fde68a','#fffbeb'],'樂器行':['🎹','#e11d48','#fff','#fff1f2'],
  '公車站':['🚌','#0ea5e9','#fff','#f0f9ff'],'動物園':['🦁','#65a30d','#fff','#f7fee7'],'電影院':['🎬','#7c3aed','#fff','#f5f3ff'],'博物館':['🏛️','#78716c','#fff','#fafaf9'],'火車站':['🚆','#0284c7','#fff','#f0f9ff'],
  '高鐵站':['🚄','#f97316','#fff','#fff7ed'],'遊樂園':['🎢','#db2777','#fff','#fdf2f8'],'飯店':['🏨','#0f766e','#fff','#f0fdfa']};
const LOOK0=['🏪','#f59e0b','#fff','#fffbeb'];
/* 三個價位街區（左→右）。LOCKED＝街區是否鎖住：true＝灰色＋🔒、整區不能點。
   ⚠️ 解鎖機制（銀行換錢、老師設定、localStorage 進度）是批次 Z3，現在先手動改這裡；要開放某一區，把它改成 false 就好。 */
const LOCKED={100:false,1000:true,10000:true};
const DISTRICTS=[
  {d:100,name:'巷口小街',lim:'100 元以內',money:'1・5・10・50 元',c:'#f97316',bg:'#fff7ed'},
  {d:1000,name:'熱鬧大街',lim:'1000 元以內',money:'＋100・500 元鈔',c:'#2563eb',bg:'#eff6ff'},
  {d:10000,name:'百貨商場',lim:'10000 元以內',money:'＋1000 元鈔',c:'#9333ea',bg:'#faf5ff'}];
/* 各街區規劃中的店（灰色「即將開幕」）與買票場所（圓頂）。['店名','emoji 換成別的']＝同名店在不同街區用不同圖（服飾店三區都有）。
   上線後 catalog 有同名、同街區的 shop 就自動變彩色可點。便當店等三位數的套餐便當，所以在熱鬧大街、不在巷口小街。 */
const PLACES={
  100:{shops:['飲料店','中式餐館','服飾店'],venues:['公車站','動物園']},
  1000:{shops:[['服飾店','👕'],'鞋店','便當店','書店','運動用品店','水果行'],venues:['電影院','博物館','火車站']},
  10000:{shops:['家電行','腳踏車店','電腦用品店','家具行','樂器行',['服飾店','🧥']],venues:['高鐵站','遊樂園','飯店']}};
/* 地圖幾何（viewBox 1000×530）：圓心在下方中央，半徑 R0 以內是入口，R0～R1 切三片 60° 扇形（zone i 的角度 180-60(i+1)～180-60i） */
const GEO={cx:500,cy:508,R0:80,R1:492,W:1000,H:530};
const BS=.78,BANK={r:158,w:76*BS,h:124*BS},GAP=3;   /* 銀行縮放 BS；方塊＝本體加上兩顆小標籤 */
const rad=d=>d*Math.PI/180;
const P=(r,d)=>[GEO.cx+r*Math.cos(rad(d)),GEO.cy-r*Math.sin(rad(d))];
let CAT=null,GAMES=[],SEL=null,LEVEL=2,LAYOUT=null;
try{const v=+localStorage.getItem('ys_game_lv');if([1,2,3].includes(v))LEVEL=v}catch(e){}      /* 記住老師上次選的提示強弱（只是方便，讀不到就用弱提示） */
function url(g,n){const lv=LV.find(l=>l.id===LEVEL);const p=(g.params||'').split('&').filter(x=>x&&!/^stage=/.test(x));p.push('stage='+n,'lv='+LEVEL,'mode='+lv.mode);return CAT.backend+g.endpoint+'?'+p.join('&')}
const nameOf=g=>g.shop||g.title;
const distOf=g=>DISTRICTS.some(z=>z.d===g.district)?g.district:100;
const emoOf=g=>(LOOK[nameOf(g)]||LOOK0)[0];
/* 關卡欄在地圖下方時（≤1100px），點店後捲到關卡欄讓學生看得到 */
function toSide(){if(matchMedia('(max-width:1100px)').matches)$('#side').scrollIntoView({behavior:'smooth',block:'end'})}
function side(){const g=GAMES.find(x=>x.id===SEL);if(!g){$('#side').innerHTML='';return}
  $('#side').innerHTML=`<div class="sidehead"><div class="nm">${emoOf(g)} ${esc(nameOf(g))}</div><div class="ds">${esc(g.desc||'')}</div>
    <div class="lvlrow">提示：<span class="lvl">${LV.map(l=>`<button type="button" data-lv="${l.id}" class="${l.id===LEVEL?'on':''}" aria-pressed="${l.id===LEVEL}">${l.name}</button>`).join('')}</span></div></div>
    <div class="stages">${(g.stages||[]).map(s=>`<a class="stage" href="${esc(url(g,s.n))}" target="_blank" rel="noopener"><b>第 ${s.n} 關</b><span>${esc(s.name)}</span><small>${esc(s.sub||'')}</small></a>`).join('')}</div>`;
  $('#side').querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{LEVEL=+b.dataset.lv;try{localStorage.setItem('ys_game_lv',LEVEL)}catch(e){}side()})}

/* ---------- 版面：每個扇區自動排店 ---------- */
/* 一間店的「佔位方塊」：建築縮放 s、店名牌字級隨 s 縮小；原點＝門口地面，方塊中心相對原點的 y 位移＝cyoff */
function dims(name,s){const fs=Math.max(11.5,Math.min(15,s*30+1.5)),ph=fs+6,lw=[...name].length*fs+10;
  const w=Math.max(150*s,lw),top=-158*s,bot=4+ph;return{fs,ph,lw,w,h:bot-top,top,bot,cyoff:(top+bot)/2}}
function zoneItems(zi){const D=DISTRICTS[zi],live=GAMES.filter(g=>distOf(g)===D.d),names=new Set(live.map(nameOf));
  const planned=(list,venue)=>list.map(e=>Array.isArray(e)?{name:e[0],emo:e[1],venue}:{name:e,venue}).filter(x=>!names.has(x.name));
  const pl=PLACES[D.d]||{shops:[],venues:[]};
  return live.map(g=>({name:nameOf(g),id:g.id,venue:false})).concat(planned(pl.shops,false),planned(pl.venues,true))}
function zoneGeo(zi){const lo=180-60*(zi+1),hi=lo+60,a=rad(lo),b=rad(hi);
  const inS=(x,y,m)=>{const dx=x-GEO.cx,dy=GEO.cy-y;return Math.hypot(dx,dy)<=GEO.R1-m&&Math.cos(a)*dy-Math.sin(a)*dx>=m&&dx*Math.sin(b)-dy*Math.cos(b)>=m};
  const fits=(x,y,w,h,m)=>{if(!(inS(x-w/2,y-h/2,m)&&inS(x+w/2,y-h/2,m)&&inS(x-w/2,y+h/2,m)&&inS(x+w/2,y+h/2,m)))return false;
    const nx=Math.min(Math.max(GEO.cx,x-w/2),x+w/2),ny=Math.min(Math.max(GEO.cy,y-h/2),y+h/2);return Math.hypot(nx-GEO.cx,ny-GEO.cy)>=GEO.R0+m};
  return{lo,hi,inS,fits}}
const clear=(p,q)=>Math.max(Math.abs(p.x-q.x)-(p.w+q.w)/2,Math.abs(p.y-q.y)-(p.h+q.h)/2);   /* ≥ 0 才沒重疊；越大離得越開 */
function plateOf(zi){const D=DISTRICTS[zi],t=D.name+(LOCKED[D.d]?'🔒':'');
  return{lines:[t,D.lim,'用到：'+D.money],w:Math.max(t.length*22+40,(D.lim.length*10)+16,('用到：'+D.money).length*12+16),h:76}}
function layoutZone(zi,s,items){const G=zoneGeo(zi),mid=(G.lo+G.hi)/2,pl=plateOf(zi);
  const banks=[120,60].map(a=>{const[x,y]=P(BANK.r,a);return{x,y,w:BANK.w,h:BANK.h}});
  let plate=null;for(let r=GEO.R1-40;r>GEO.R0+100;r-=3){const[x,y]=P(r,mid),q={x,y,w:pl.w,h:pl.h};
    if(G.fits(x,y,q.w,q.h,4)&&banks.every(k=>clear(q,k)>=GAP)){plate=q;break}}
  if(!plate)return null;
  const obs=banks.concat([plate]),ds=items.map(it=>dims(it.name,s));
  const cand=[];for(let x=GEO.cx-GEO.R1;x<=GEO.cx+GEO.R1;x+=6)for(let y=GEO.cy-GEO.R1;y<=GEO.cy;y+=6)if(G.inS(x,y,10))cand.push([x,y]);
  const placed=[],box=(i,x,y)=>({x,y,w:ds[i].w,h:ds[i].h});
  const score=(i,x,y,others)=>{const q=box(i,x,y);let m=1e9;for(const o of others){const c=clear(q,o);if(c<m)m=c}return m};
  const best=(i,others)=>{let bx=null,bs=-1e9;for(const[x,y]of cand){if(!G.fits(x,y,ds[i].w,ds[i].h,GAP))continue;const sc=score(i,x,y,others);if(sc>bs){bs=sc;bx=[x,y]}}return bx&&{x:bx[0],y:bx[1],sc:bs}};
  const order=items.map((_,i)=>i).sort((i,j)=>ds[j].w-ds[i].w);
  for(const i of order){const b=best(i,obs.concat(Object.values(placed).map(p=>box(p.i,p.x,p.y))));if(!b)return null;placed[i]={i,x:b.x,y:b.y}}
  for(let pass=0;pass<8;pass++)for(const i of order){const others=obs.concat(items.map((_,j)=>j).filter(j=>j!==i).map(j=>box(j,placed[j].x,placed[j].y)));
    const b=best(i,others);if(b)placed[i]={i,x:b.x,y:b.y}}
  let mc=1e9;const all=obs.concat(items.map((_,i)=>box(i,placed[i].x,placed[i].y)));
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){mc=Math.min(mc,clear(all[i],all[j]))}
  return{ok:mc>=GAP-.01,plate,banks,pl,pos:items.map((it,i)=>({it,x:placed[i].x,y:placed[i].y,d:ds[i]}))}}
/* 找「所有扇區都排得下」的最大縮放 s；店很多時自動縮小（排不下就用最小的） */
function computeLayout(){const zs=DISTRICTS.map((_,i)=>zoneItems(i));let res=null,sUsed=0;
  for(let s=.56;s>=.24;s=Math.round((s-.02)*100)/100){const r=zs.map((it,i)=>layoutZone(i,s,it));if(r.every(x=>x&&x.ok)){res=r;sUsed=s;break}if(s<=.241){res=r;sUsed=s}}
  return{s:sUsed,zones:res,items:zs}}

/* ---------- 畫 ---------- */
/* 一間店（buildings 縮放 s）：屋頂、條紋雨棚、牆、門窗、emoji 招牌、店名牌；mode＝live（彩色可點）｜soon（灰色即將開幕）｜lock（街區鎖住） */
function shopSvg(p,s,mode,sel){
  const it=p.it,[emo0,c1,c2,wall]=LOOK[it.name]||LOOK0,emo=it.emo||emo0,d=p.d,sw=(2/s).toFixed(2),live=mode==='live';
  const ox=p.x.toFixed(1),oy=(p.y-d.cyoff).toFixed(1);
  const stripes=Array.from({length:7},(_,i)=>`<rect x="${-70+i*20}" y="-96" width="20" height="26" fill="${i%2?c2:c1}"/>`).join('');
  const roof=it.venue?`<path d="M-74,-96 A74,56 0 0 1 74,-96 Z" fill="${c1}" stroke="#3b2f2f" stroke-width="${sw}"/><circle cx="0" cy="-153" r="6" fill="#facc15" stroke="#3b2f2f" stroke-width="${sw}"/>`
    :`<polygon points="-78,-96 78,-96 64,-136 -64,-136" fill="${c1}" stroke="#3b2f2f" stroke-width="${sw}" stroke-linejoin="round"/>`;
  const attr=live?` tabindex="0" role="button" data-id="${esc(it.id)}" aria-label="${esc(it.name)}" aria-pressed="${it.id===sel}"`:' aria-hidden="true"';
  const ribbon=mode==='soon'?`<g transform="rotate(-8 0 -34)"><rect x="-62" y="-52" width="124" height="34" rx="6" fill="#6b7683" stroke="#3b2f2f" stroke-width="${sw}"/><text x="0" y="-27" text-anchor="middle" font-size="25" font-weight="800" fill="#fff">即將開幕</text></g>`:'';
  return `<g transform="translate(${ox},${oy})"><g class="shop it${live?'':' soon'}${it.id&&it.id===sel?' on':''}"${attr}>
  <rect class="ring" x="${(-d.w/2).toFixed(1)}" y="${d.top.toFixed(1)}" width="${d.w.toFixed(1)}" height="${(d.bot-d.top).toFixed(1)}" rx="10" stroke-width="3"/>
  <g class="lift"${live?'':' filter="url(#gray)" opacity=".55"'}>
    <g transform="scale(${s})">
      <ellipse cx="0" cy="6" rx="80" ry="10" fill="#000" opacity=".1"/>
      ${roof}
      <rect x="-64" y="-70" width="128" height="76" rx="4" fill="${wall}" stroke="#3b2f2f" stroke-width="${sw}"/>
      <g clip-path="url(#aw)">${stripes}</g>
      <path d="M-70,-70 q10,10 20,0 q10,10 20,0 q10,10 20,0 q10,10 20,0 q10,10 20,0 q10,10 20,0 q10,10 20,0" fill="none" stroke="#3b2f2f" stroke-width="${sw}"/>
      <rect x="-70" y="-96" width="140" height="26" fill="none" stroke="#3b2f2f" stroke-width="${sw}"/>
      <rect x="-16" y="-40" width="32" height="46" rx="4" fill="#b45309" stroke="#3b2f2f" stroke-width="${sw}"/>
      <rect x="-56" y="-48" width="30" height="26" rx="3" fill="#bae6fd" stroke="#3b2f2f" stroke-width="${sw}"/>
      <rect x="26" y="-48" width="30" height="26" rx="3" fill="#bae6fd" stroke="#3b2f2f" stroke-width="${sw}"/>
      <text x="0" y="-104" text-anchor="middle" font-size="34">${emo}</text>${ribbon}
    </g>
    <rect class="lb" x="${(-d.lw/2).toFixed(1)}" y="4" width="${d.lw.toFixed(1)}" height="${d.ph.toFixed(1)}" rx="${(d.ph/2).toFixed(1)}" stroke="#3b2f2f" stroke-width="1.8"/>
    <text class="lbt" x="0" y="${(4+d.ph*.74).toFixed(1)}" text-anchor="middle" font-size="${d.fs.toFixed(1)}" font-weight="800">${esc(it.name)}</text>
  </g></g></g>`}
function bankSvg(b){return `<g transform="translate(${b.x.toFixed(1)},${b.y.toFixed(1)}) scale(${BS})" aria-hidden="true">
  <polygon points="-36,-28 36,-28 0,-60" fill="#ca8a04" stroke="#3b2f2f" stroke-width="2.4" stroke-linejoin="round"/>
  <text y="-32" text-anchor="middle" font-size="15" font-weight="900" fill="#fff">$</text>
  <rect x="-30" y="-28" width="60" height="36" fill="#fef3c7" stroke="#3b2f2f" stroke-width="2.4"/>
  ${[-20,-7,7,20].map(x=>`<line x1="${x}" y1="-24" x2="${x}" y2="4" stroke="#a16207" stroke-width="4"/>`).join('')}
  <rect x="-34" y="8" width="68" height="6" fill="#d6d3d1" stroke="#3b2f2f" stroke-width="2"/>
  <rect x="-25" y="19" width="50" height="22" rx="11" fill="#facc15" stroke="#3b2f2f" stroke-width="1.8"/><text y="35" text-anchor="middle" font-size="15" font-weight="900" fill="#2b3440">銀行</text>
  <rect x="-37" y="44" width="74" height="18" rx="9" fill="#e5e7eb" stroke="#3b2f2f" stroke-width="1.5"/><text y="58" text-anchor="middle" font-size="14" font-weight="800" fill="#6b7683">即將開放</text></g>`}
function plateSvg(zi,pt,pl){const D=DISTRICTS[zi],lock=LOCKED[D.d],nw=pl.lines[0].length*22+30;
  return `<g class="plate" transform="translate(${pt.x.toFixed(1)},${pt.y.toFixed(1)})">
  <rect x="${-pt.w/2}" y="${-pt.h/2}" width="${pt.w}" height="${pt.h}" rx="16" fill="#fff" opacity=".78"/>
  <rect x="${-nw/2}" y="${-pt.h/2+4}" width="${nw}" height="32" rx="16" fill="${lock?'#9ca3af':D.c}" stroke="#3b2f2f" stroke-width="2.5"/>
  <text y="${-pt.h/2+27}" text-anchor="middle" font-size="22" font-weight="900" fill="#fff">${pl.lines[0]}</text>
  <text y="${-pt.h/2+51}" text-anchor="middle" font-size="15" font-weight="800" fill="#1f2937">${pl.lines[1]}</text>
  <text y="${-pt.h/2+68}" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">${pl.lines[2]}</text></g>`}
function sectorPath(zi){const lo=180-60*(zi+1),hi=lo+60,a=P(GEO.R1,lo),b=P(GEO.R1,hi);
  return `M${GEO.cx},${GEO.cy} L${a[0].toFixed(1)},${a[1].toFixed(1)} A${GEO.R1},${GEO.R1} 0 0 0 ${b[0].toFixed(1)},${b[1].toFixed(1)} Z`}
function map(){
  const L=LAYOUT,all=[];
  const body=DISTRICTS.map((D,zi)=>{const z=L.zones[zi],lock=LOCKED[D.d];
    z.pos.forEach(p=>all.push([p,lock?'lock':(p.it.id?'live':'soon')]));return ''}).join('');
  const shops=all.sort((a,b)=>a[0].y-b[0].y).map(([p,m])=>shopSvg(p,L.s,m,SEL)).join('');
  const secs=DISTRICTS.map((D,zi)=>`<path d="${sectorPath(zi)}" fill="${LOCKED[D.d]?'#e5e7eb':D.bg}" stroke="#3b2f2f" stroke-width="4" stroke-linejoin="round"/>`).join('');
  $('#map').innerHTML=`<svg id="mapsvg" viewBox="0 0 ${GEO.W} ${GEO.H}" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="互動遊戲小鎮地圖">
<defs><filter id="gray"><feColorMatrix type="saturate" values="0"/></filter><clipPath id="aw"><rect x="-70" y="-96" width="140" height="26"/></clipPath></defs>
${secs}
${DISTRICTS.map((D,zi)=>plateSvg(zi,L.zones[zi].plate,L.zones[zi].pl)).join('')}
<path d="M${GEO.cx-GEO.R0},${GEO.cy} A${GEO.R0},${GEO.R0} 0 0 1 ${GEO.cx+GEO.R0},${GEO.cy} Z" fill="#9ca3af" stroke="#3b2f2f" stroke-width="4"/>
<text class="gate" x="${GEO.cx}" y="${GEO.cy-26}" text-anchor="middle" font-size="24" font-weight="900" fill="#fff">🚶 入口</text>
${L.zones[0].banks.map(bankSvg).join('')}
${shops}
</svg>`;
  $('#map').querySelectorAll('.shop[data-id]').forEach(el=>{
    const pick=()=>{SEL=el.dataset.id;map();side();toSide();$(`#map .shop[data-id="${CSS.escape(SEL)}"]`)?.focus({preventScroll:true})};
    el.onclick=pick;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick()}}});
  const chip=(n,emo,id,dis)=>`<button type="button" ${id?`data-id="${esc(id)}"`:''} ${dis?'disabled':''} class="${id&&id===SEL?'on':''}" aria-pressed="${id===SEL}">${emo} ${esc(n)}</button>`;
  $('#chips').innerHTML=DISTRICTS.map((D,zi)=>{const lock=LOCKED[D.d],its=L.items[zi];
    const btns=lock?its.map(it=>chip(it.name,(it.emo||(LOOK[it.name]||LOOK0)[0]),null,true)):its.filter(it=>it.id).map(it=>chip(it.name,(LOOK[it.name]||LOOK0)[0],it.id,false));
    return `<div><div class="gt">${esc(D.name)}・${esc(D.lim)}${lock?' 🔒':''}</div><div class="row">${btns.join('')||'<span class="empty" style="padding:0">即將開幕</span>'}</div></div>`}).join('');
  $('#chips').querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>{SEL=b.dataset.id;map();side();toSide()})}
async function load(){
  try{CAT=await fetch('../dashboard/catalog.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json());
    GAMES=CAT.items.filter(i=>i.kind==='game');
    const sel=GAMES.find(g=>g.id===SEL);if(!sel||LOCKED[distOf(sel)])SEL=(GAMES.find(g=>!LOCKED[distOf(g)])||{}).id||null;
    LAYOUT=computeLayout();window.__GEO=GEO;window.__LAYOUT=LAYOUT;window.__LOCKED=LOCKED;
    map();side()}
  catch(e){$('#map').innerHTML='<div class="empty">載入失敗：請用 http(s) 開啟（'+esc(e.message)+'）</div>'}}
load();
</script>
</body>
