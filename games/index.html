<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>互動遊戲小鎮</title>
<!-- 互動遊戲導覽頁「小鎮地圖」。2026-11-18 起是 Gemini 插畫版（docs/價位街區_規劃.md 第 10 節）：底圖 games/town/bg.webp（1376×768），
     店家是去背、依 alpha 裁邊的 games/town/shop_*.webp（meta.json 記檔名與寬高），由程式沿著路擺在草地上（PLOTS，不再有空地）；店名牌、區名牌、「即將開幕」、銀行字都由程式寫。
     左＝巷口小街（100 元以內）、中＝熱鬧大街（1000 元以內）、右＝百貨商場（10000 元以內）；銀行（河上木橋旁、山丘小路旁）還不能點。
     店的位置＝PLOTS［街區］［店名］＝[x,y,w]（place_shops.py 排好寫入，說明見下方）；新增店＝catalog 的 kind:'game' 加一筆（district 預設 100）＋games/town 補圖（沒圖用施工中）＋重排位置；
     規劃中的店寫進 PLACES；解鎖街區＝改 LOCKED。資料讀 dashboard/catalog.json 的 kind:'game' 項目（shop／tag／desc／stages）。
     注意：load() 只跑一次；map() 每次整個重畫，不會疊加元素。 -->
<style>
@font-face{font-family:"芫荽";src:url('../fonts/Iansui-Regular.ttf') format('truetype');font-display:swap}
:root{--L0:#3f8f8a;--L1:#2f4d6e;--bg:#f6f5f2;--card:#fff;--ink:#2b3440;--mute:#6b7683;--line:#e3e0d9;--ac:#e8863a;--game:#ea580c;--game-ink:#c2410c;--h1:#2f4d6e;--frame:#3b2f2f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--L0:#3a8a86;--L1:#27405c;--bg:#1d2128;--card:#272c35;--ink:#e8eaee;--mute:#9aa4b1;--line:#3a414d;--ac:#f09a55;--game:#f97316;--game-ink:#fdba74;--h1:#dbe7f3;--frame:#0f1115}}
:root[data-theme="dark"]{--L0:#3a8a86;--L1:#27405c;--bg:#1d2128;--card:#272c35;--ink:#e8eaee;--mute:#9aa4b1;--line:#3a414d;--ac:#f09a55;--game:#f97316;--game-ink:#fdba74;--h1:#dbe7f3;--frame:#0f1115}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "芫荽","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
/* 左側邊緣直式標籤（與互動學習單總覽同款）：回易數教室、到互動學習單 */
.edgetabs{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.edgetab{display:block;flex:none;height:max-content;writing-mode:vertical-rl;background:var(--L0);color:#fff;text-decoration:none;font-weight:800;letter-spacing:.25em;padding:16px 8px;border-radius:0 12px 12px 0;box-shadow:2px 2px 8px rgba(0,0,0,.2);font-size:16px}
.edgetab.ws{background:var(--L1)}.edgetab:hover{filter:brightness(1.12)}
.page{display:grid;grid-template-columns:minmax(0,1fr) 320px;height:100vh}
main{padding:14px 14px 14px 56px;display:flex;flex-direction:column;min-width:0;min-height:0}
h1{margin:0;font-size:28px;color:var(--h1)}
.sub{color:var(--mute);font-size:16px;margin-bottom:8px}
/* 地圖：插畫本身固定用亮色（像一張紙本地圖），深色模式只換外框與頁面 */
.map{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center}
.map svg{display:block;max-width:100%;max-height:100%;border-radius:22px;border:4px solid var(--frame);box-shadow:0 6px 0 rgba(0,0,0,.12);background:#bfe3f0}
.map svg text{font-family:"芫荽","Noto Sans TC",sans-serif}
.shop{cursor:pointer;outline:none}
.shop .lift{transition:transform .2s}
.shop:hover .lift{transform:translateY(-5px)}
.shop .ring{fill:none;stroke:transparent;stroke-width:5}
.shop.on .ring{stroke:var(--game)}
.shop.on .simg{filter:drop-shadow(0 0 7px #fb923c) drop-shadow(0 0 3px #fb923c)}
.shop:focus-visible .ring{stroke:#1d4ed8;stroke-dasharray:12 7}
/* 店名：雨棚上的白底小牌、三層樓以上的直式招牌、沒有雨棚的場所寫在最合適的位置（錨點見 meta.json）；沒有錨點才退回貼底邊的小名牌 */
.plt{transition:transform .2s}.plt.hov{transform:translateY(-5px)}
.plt .lb{fill:#fff;fill-opacity:.9;stroke:#3b2f2f;stroke-width:1.2}.plt .lbt{fill:#2b3440}
.plt.vs .lb{fill:#1e3a5f;fill-opacity:1;stroke:#0f172a}.plt.vs .lbt{fill:#fff}
.plt.on .lb{fill:#ea580c;fill-opacity:1}.plt.on .lbt{fill:#fff}
.plt.soon .lb{fill:#f3f4f6;stroke:#6b7683}.plt.soon .lbt{fill:#6b7683}
.plt.vs.soon .lb{fill:#6b7683}.plt.vs.soon .lbt{fill:#fff}
.plt.lock .lb{fill:#e5e7eb;stroke:#9ca3af}.plt.lock .lbt{fill:#6b7280}
.plt.vs.lock .lb{fill:#9ca3af}.plt.vs.lock .lbt{fill:#fff}
.tag .lb{fill:#6b7683;stroke:#3b2f2f;stroke-width:1.2}.tag .lbt{fill:#fff}
.shop.soon,.shop.lock{cursor:default}.shop.soon:hover .lift,.shop.lock:hover .lift{transform:none}
.shop.soon .simg{filter:saturate(.45) brightness(1.06);opacity:.9}
.shop.lock .simg,.simg.site.lock{filter:grayscale(1) brightness(1.08)}

/* 右側欄：選中的店、關卡、提示強弱 */
aside{background:var(--bg);border-left:4px solid var(--game);padding:18px;overflow:auto}
aside .nm{font-size:26px;font-weight:800}
aside .ds{font-size:16px;color:var(--mute);margin-bottom:10px}
.stage{display:block;text-decoration:none;color:inherit;border:3px solid var(--game);border-radius:14px;padding:8px 14px;margin-bottom:9px;background:var(--card);border-bottom-width:6px}
.stage:hover{filter:brightness(1.04)}.stage:active{translate:0 2px;border-bottom-width:4px}
.stage b{font-size:19px;color:var(--game-ink)}.stage span{font-size:19px;font-weight:800;margin-left:10px}
.stage small{display:block;font-size:15px;color:var(--mute)}
.lvlrow{display:flex;align-items:center;gap:8px;margin:4px 0 12px;font-size:17px}
.lvl{display:inline-flex;border:2px solid var(--ac);border-radius:12px;overflow:hidden}
.lvl button{border:0;background:none;font:inherit;font-size:17px;font-weight:800;color:var(--ac);padding:6px 14px;cursor:pointer}
.lvl button.on{background:var(--ac);color:#fff}
.empty{color:var(--mute);padding:40px 0}
/* 手機：地圖上的店名太小，地圖下面另外給一排店名按鈕（依街區分組；鎖住的街區按鈕灰色不能點） */
.chips{display:none;flex-direction:column;gap:10px;margin-top:10px}
.chips .gt{font-size:16px;font-weight:800;color:var(--mute);margin-bottom:4px}
.chips .row{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:inherit;font-size:17px;font-weight:800;border:3px solid var(--game);border-radius:999px;background:var(--card);color:var(--ink);padding:4px 14px;cursor:pointer}
.chips button.on{background:var(--game);color:#fff}
.chips button:disabled{border-color:#cbd5e1;background:#f1f5f9;color:#94a3b8;cursor:not-allowed}
@media (max-width:600px){.chips{display:flex}}
/* 平板／窄螢幕（≤1100px）：關卡欄移到地圖下方，地圖用滿整個寬度；左＝店名＋說明＋提示強弱，右＝關卡 3 欄格狀 */
@media (max-width:1100px){.page{grid-template-columns:1fr;height:auto}main{padding:10px 12px 10px 46px}h1{font-size:24px}.sub{margin-bottom:4px}
  .map svg{width:100%;max-height:none;height:auto}
  aside{border-left:0;border-top:4px solid var(--game);padding:16px 16px 20px 50px;display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:8px 22px;align-items:start}
  .stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .stage{min-height:56px;margin-bottom:0;padding:8px 12px}.stage b,.stage span{font-size:18px}.stage span{margin-left:8px}}
/* 手機：關卡欄上下堆疊、關卡一欄 */
@media (max-width:600px){aside{display:block;padding:16px 16px 18px 50px}.stages{grid-template-columns:1fr}.stage{margin-bottom:9px}}
</style>
</head>
<body>
<div class="edgetabs"><a class="edgetab" href="../" title="回易數教室">易數教室</a><a class="edgetab ws" href="../interactive/" title="互動學習單">互動學習單</a></div>
<div class="page">
  <main>
    <h1>🗺️ 互動遊戲小鎮</h1>
    <div class="sub">點一間店，選一個關卡開始玩（灰色的街區還沒開放）</div>
    <div class="map" id="map"><div class="empty">載入中…</div></div>
    <div class="chips" id="chips"></div>
  </main>
  <aside id="side"></aside>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LV=[{id:3,name:'強',mode:'full'},{id:2,name:'弱',mode:'faded'},{id:1,name:'無',mode:'free'}];
/* 三個價位街區（左→右）。LOCKED＝街區是否鎖住：true＝整區灰階＋🔒、不能點。
   ⚠️ 解鎖機制（銀行換錢、老師設定、localStorage 進度）是批次 Z3，現在先手動改這裡；要開放某一區，把它改成 false 就好。 */
const LOCKED={100:false,1000:true,10000:true};
const DISTRICTS=[
  {d:100,name:'巷口小街',lim:'100 元以內',money:'用到：1・5・10・50 元',c:'#f97316'},
  {d:1000,name:'熱鬧大街',lim:'1000 元以內',money:'用到：＋100・500 元鈔',c:'#2563eb'},
  {d:10000,name:'百貨商場',lim:'10000 元以內',money:'用到：＋1000 元鈔',c:'#9333ea'}];
/* 各街區規劃中的店與買票場所（淡色＋「即將開幕」）。上線後 catalog 有同名、同街區的 shop 就自動變彩色可點。
   圖檔對照：店名 → games/town/meta.json 的 key；服飾店三區不同圖（服飾店_100／_1000／_10000），其他同名。 */
const PLACES={100:['飲料店','中式餐館','服飾店','公車站','動物園'],1000:['服飾店','鞋店','便當店','書店','運動用品店','水果行','電影院','博物館','火車站'],
  10000:['家電行','腳踏車店','電腦用品店','家具行','樂器行','服飾店','高鐵站','遊樂園','飯店']};
const imgKey=(n,d)=>n==='服飾店'?'服飾店_'+d:n;
/* ===== 小鎮地圖：店沿著路自由擺放（viewBox 1376×768，同底圖 bg.webp 的像素座標；2026-11-18 第三輪，底圖已移除空地）=====
   PLOTS[街區][店名]＝[x,y,w]：x＝店圖底座中心、y＝店圖底邊、w＝店圖寬（同街區、同一類的店寬度一樣）。SPARE[街區]＝[[x,y,w,畫不畫施工中],…]：預留位置，
   畫出來的（第 4 項 1）是「施工中」、沒畫的（0）是隱形候選；新增店沒寫在 PLOTS 時，依序取該區 SPARE 的一個（取用的施工中就不再畫）。
   這兩個常數由 python3 docs/mock-town-gemini/place_shops.py [seed] 排好後自動寫入（標記之間不要手改）；地形遮罩 terrain.py；驗收 node docs/mock-town-gemini/town_check.js。
   新增店：catalog 的 kind:'game' 加一筆（district 預設 100）→ games/town 補圖（沒圖用施工中）＋ meta.json 補錨點（build_town.py 的 ANCH）→ 重跑 place_shops.py。 */
/*PLOTS-START*/
const PLOTS={"100":{"早餐店":[106,320,93],"麵包店":[322,736,93],"文具店":[430,232,93],"糖果餅乾店":[98,512,93],"玩具店":[390,452,93],"飲料店":[206,436,93],"中式餐館":[198,232,93],"服飾店":[290,520,93],"公車站":[94,396,87],"動物園":[342,292,87]},"1000":{"服飾店":[554,200,76],"鞋店":[626,204,76],"便當店":[622,484,76],"書店":[798,624,76],"運動用品店":[766,248,76],"水果行":[614,596,76],"電影院":[614,328,76],"博物館":[758,480,70],"火車站":[830,740,70]},"10000":{"家電行":[1234,256,92],"腳踏車店":[930,528,92],"電腦用品店":[1322,324,92],"家具行":[954,252,92],"樂器行":[1122,460,92],"服飾店":[1038,192,92],"高鐵站":[1010,316,73],"遊樂園":[970,724,73],"飯店":[1046,576,92]}};
const SPARE={"100":[[290,348,93,1],[302,196,93,1],[478,532,93,0]],"1000":[[586,376,76,1],[750,312,76,1],[750,368,76,0]],"10000":[[1002,404,80,1],[1030,360,80,1],[1122,180,80,0]]};
/*PLOTS-END*/
const ZPLATE=[[260,16],[688,10],[1250,16]],ZW=240,ZH=82;       /* 區名牌：中心 x、上緣 y */
const BANKS=[[490,600],[905,600]],BANKW=78;                      /* 銀行（河上木橋旁、山丘小路旁）：中心 x、y */
const FS=12,PH=16;                                               /* 退回用的底邊小名牌：字級、高度（地圖單位） */
const W=1376,H=768;
let CAT=null,GAMES=[],META={},SEL=null,LEVEL=2;
try{const v=+localStorage.getItem('ys_game_lv');if([1,2,3].includes(v))LEVEL=v}catch(e){}      /* 記住老師上次選的提示強弱（只是方便，讀不到就用弱提示） */
function url(g,n){const lv=LV.find(l=>l.id===LEVEL);const p=(g.params||'').split('&').filter(x=>x&&!/^stage=/.test(x));p.push('stage='+n,'lv='+LEVEL,'mode='+lv.mode);return CAT.backend+g.endpoint+'?'+p.join('&')}
const nameOf=g=>g.shop||g.title;
const distOf=g=>DISTRICTS.some(z=>z.d===g.district)?g.district:100;
/* 關卡欄在地圖下方時（≤1100px），點店後捲到關卡欄讓學生看得到 */
function toSide(){if(matchMedia('(max-width:1100px)').matches)$('#side').scrollIntoView({behavior:'smooth',block:'end'})}
function side(){const g=GAMES.find(x=>x.id===SEL);if(!g){$('#side').innerHTML='';return}
  $('#side').innerHTML=`<div class="sidehead"><div class="nm">${esc(nameOf(g))}</div><div class="ds">${esc(g.desc||'')}</div>
    <div class="lvlrow">提示：<span class="lvl">${LV.map(l=>`<button type="button" data-lv="${l.id}" class="${l.id===LEVEL?'on':''}" aria-pressed="${l.id===LEVEL}">${l.name}</button>`).join('')}</span></div></div>
    <div class="stages">${(g.stages||[]).map(s=>`<a class="stage" href="${esc(url(g,s.n))}" target="_blank" rel="noopener"><b>第 ${s.n} 關</b><span>${esc(s.name)}</span><small>${esc(s.sub||'')}</small></a>`).join('')}</div>`;
  $('#side').querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{LEVEL=+b.dataset.lv;try{localStorage.setItem('ys_game_lv',LEVEL)}catch(e){}side()})}

/* 每個街區的項目：已上線（catalog）＋規劃中（PLACES），各自對到 PLOTS 的位置；沒有位置的依序取 SPARE（離入口最近的預留位置），用完就不畫（手機按鈕列仍會列出） */
function zoneItems(zi){const D=DISTRICTS[zi],pl=PLOTS[D.d]||{},sp=(SPARE[D.d]||[]).slice();
  const live=GAMES.filter(g=>distOf(g)===D.d).map(g=>({name:nameOf(g),id:g.id})),names=new Set(live.map(i=>i.name));
  const items=live.concat((PLACES[D.d]||[]).filter(n=>!names.has(n)).map(n=>({name:n})));
  const place=(m,p)=>[p[0],p[1],p[2],p[2]*m.h/m.w];                /* pos＝[x,y,w,h]：x 底座中心、y 底邊 */
  items.forEach(it=>{it.d=D.d;it.key=imgKey(it.name,D.d);it.m=META[it.key]||META['施工中'];it.noimg=!META[it.key];
    let p=pl[it.name];if(!p&&sp.length)p=sp.shift().slice(0,3);it.pos=p?place(it.m,p):null});
  const rest=sp.filter(p=>p[3]).map(p=>place(META['施工中'],p));
  return{items,rest}}
const labW=n=>[...n].length*FS+16;
function imgEl(it,cls,extra){const[x,y,w,h]=it.pos;return `<image class="${cls}" href="town/${it.m.f}" x="${(x-w/2).toFixed(1)}" y="${(y-h).toFixed(1)}" width="${w}" height="${h.toFixed(1)}"${extra||''}/>`}
/* 一間店：店圖（image）、店名牌（rect＋text）；全部店圖先畫、再畫名牌，名牌就不會被別的店蓋住 */
function shopImg(it,mode,sel){const[x,y,w,h]=it.pos,live=mode==='live',on=live&&it.id===sel;
  const attr=live?` tabindex="0" role="button" data-id="${esc(it.id)}" aria-label="${esc(it.name)}" aria-pressed="${on}"`:' aria-hidden="true"';
  return `<g class="shop ${mode}${on?' on':''}"${attr} data-n="${esc(it.name)}" data-d="${it.d}"><g class="lift"><rect class="ring" x="${(x-w/2-5).toFixed(1)}" y="${(y-h-5).toFixed(1)}" width="${w+10}" height="${(h+10).toFixed(1)}" rx="12"/>${imgEl(it,'simg')}</g></g>`}
/* 店名標示。f＝字級（地圖單位；1024 寬約 ×0.744 px）。CF＝雨棚／橫式字級上限，VF＝直式招牌字級上限。TF 為最小目標（1024 寬地圖約 966px、×0.702 → 8px） */
const CF=13,VF=12.5,TF=11.4;
function nameTag(it,mode,sel){const m=it.m,[x,y,w,h]=it.pos,n=[...it.name],k=n.length,on=mode==='live'&&it.id===sel,cls=mode+(on?' on':''),ix=x-w/2,iy=y-h;
  if(it.noimg||!(m.awning||m.vsign||m.name))return shopPlate(it,mode,sel);
  if(m.vsign){const[c,a,b]=m.vsign,top=iy+a*h,span=(b-a)*h,f=Math.min(VF,(span-8)/(k*1.06)),sw=f*1.35,sh=k*f*1.06+8,cx=ix+c*w;
    return `<g class="plt vs ${cls}" data-n="${esc(it.name)}" data-anc="${(cx-sw/2).toFixed(1)},${top.toFixed(1)},${(cx+sw/2).toFixed(1)},${(top+sh).toFixed(1)}" pointer-events="none">
<line x1="${cx}" y1="${(top-4).toFixed(1)}" x2="${cx}" y2="${top.toFixed(1)}" stroke="#3b2f2f" stroke-width="1.5"/>
<rect class="lb" x="${(cx-sw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${sw.toFixed(1)}" height="${sh.toFixed(1)}" rx="3"/>
${n.map((ch,i)=>`<text class="lbt" x="${cx.toFixed(1)}" y="${(top+4+(i+.5)*f*1.06+f*.36).toFixed(1)}" text-anchor="middle" font-size="${f.toFixed(1)}" font-weight="800">${esc(ch)}</text>`).join('')}</g>`}
  const r=m.awning||m.name,rx0=ix+r[0]*w,rx1=ix+r[2]*w,ry0=iy+r[1]*h,ry1=iy+r[3]*h,rw=rx1-rx0,rh=ry1-ry0,
    f=Math.min(CF,(rw-4)/(k*.9),Math.max(rh-3,TF)),tw=Math.min(rw,k*f*.9+4),lh=Math.min(Math.max(rh,f+3),f+5),cx=(rx0+rx1)/2,cy=(ry0+ry1)/2;
  return `<g class="plt ${cls}" data-n="${esc(it.name)}" data-anc="${rx0.toFixed(1)},${ry0.toFixed(1)},${rx1.toFixed(1)},${ry1.toFixed(1)}" pointer-events="none"><rect class="lb" x="${(cx-tw/2).toFixed(1)}" y="${(cy-lh/2).toFixed(1)}" width="${tw.toFixed(1)}" height="${lh.toFixed(1)}" rx="${Math.min(4,lh/2).toFixed(1)}"/>
<text class="lbt" x="${cx.toFixed(1)}" y="${(cy+f*.36).toFixed(1)}" text-anchor="middle" font-size="${f.toFixed(1)}" font-weight="800" textLength="${(k*f*.9).toFixed(1)}" lengthAdjust="spacing">${esc(it.name)}</text></g>`}
/* 小標：即將開幕／銀行即將開放，貼在店底邊（不蓋店名） */
function tagSvg(x,y,t,cls){const tw=[...t].length*10.5+8;return `<g class="tag ${cls||''}" pointer-events="none"><rect class="lb" x="${(x-tw/2).toFixed(1)}" y="${y-1}" width="${tw.toFixed(1)}" height="15" rx="7.5"/><text class="lbt" x="${x}" y="${y+10.2}" text-anchor="middle" font-size="10.5" font-weight="800">${t}</text></g>`}
/* 退回方案：沒有錨點的店畫貼底邊的小名牌 */
function shopPlate(it,mode,sel){const[x,y]=it.pos,lw=labW(it.name),on=mode==='live'&&it.id===sel;
  return `<g class="plt ${mode}${on?' on':''}" data-n="${esc(it.name)}" pointer-events="none"><rect class="lb" x="${(x-lw/2).toFixed(1)}" y="${y-3}" width="${lw}" height="${PH}" rx="${PH/2}"/><text class="lbt" x="${x}" y="${y+13.2}" text-anchor="middle" font-size="${FS}" font-weight="800">${esc(it.name)}</text></g>`}
function plateSvg(zi){const D=DISTRICTS[zi],lock=LOCKED[D.d],[cx,ty]=ZPLATE[zi],t=D.name+(lock?'🔒':''),nw=t.length*26+44;
  return `<g class="zone${lock?' lock':''}" aria-hidden="true"><rect x="${cx-ZW/2}" y="${ty}" width="${ZW}" height="${ZH}" rx="16" fill="#fff" opacity=".82"/>
  <rect x="${cx-nw/2}" y="${ty+4}" width="${nw}" height="34" rx="17" fill="${lock?'#9ca3af':D.c}" stroke="#3b2f2f" stroke-width="2.5"/>
  <text x="${cx}" y="${ty+29}" text-anchor="middle" font-size="24" font-weight="900" fill="#fff">${t}</text>
  <text x="${cx}" y="${ty+58}" text-anchor="middle" font-size="18" font-weight="800" fill="#1f2937">${D.lim}</text>
  <text x="${cx}" y="${ty+76}" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">${D.money}</text></g>`}
function bankSvg([bx,by]){const m=META['銀行'],w=BANKW,h=w*m.h/m.w,it={name:'銀行',m,pos:[bx,by+h/2,w,h],id:null};
  return `<g class="bank" aria-hidden="true">${imgEl(it,'simg')}${nameTag(it,'soon',null)}${tagSvg(bx,by+h/2,'即將開放')}</g>`}
function map(){
  const Z=DISTRICTS.map((_,i)=>zoneItems(i)),shops=[],rest=[];
  Z.forEach((z,zi)=>{const lock=LOCKED[DISTRICTS[zi].d];
    z.rest.forEach(p=>rest.push(`<image class="simg site${lock?' lock':''}" href="town/${META['施工中'].f}" x="${(p[0]-p[2]/2).toFixed(1)}" y="${(p[1]-p[3]).toFixed(1)}" width="${p[2].toFixed(1)}" height="${p[3].toFixed(1)}" data-d="${DISTRICTS[zi].d}" aria-hidden="true"/>`));
    z.items.forEach(it=>{if(it.pos)shops.push([it,lock?'lock':(it.id?'live':'soon')])})});
  shops.sort((a,b)=>a[0].pos[1]-b[0].pos[1]);
  $('#map').innerHTML=`<svg id="mapsvg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="互動遊戲小鎮地圖">
<image href="town/bg.webp" x="0" y="0" width="${W}" height="${H}" aria-hidden="true"/>
${rest.join('')}
${BANKS.map(bankSvg).join('')}
${shops.map(([it,m])=>shopImg(it,m,SEL)).join('')}
${shops.map(([it,m])=>nameTag(it,m,SEL)+(m==='soon'?tagSvg(it.pos[0],it.pos[1],'即將開幕'):'')).join('')}
${DISTRICTS.map((_,zi)=>plateSvg(zi)).join('')}
</svg>`;
  $('#map').querySelectorAll('.shop[data-id]').forEach(el=>{
    const pick=()=>{SEL=el.dataset.id;map();side();toSide();$(`#map .shop[data-id="${CSS.escape(SEL)}"]`)?.focus({preventScroll:true})};
    const tg=()=>$(`#map .plt[data-n="${CSS.escape(el.dataset.n)}"]`),hv=on=>()=>tg()?.classList.toggle('hov',on);
    ['mouseenter','focus'].forEach(e=>el.addEventListener(e,hv(true)));['mouseleave','blur'].forEach(e=>el.addEventListener(e,hv(false)));
    el.onclick=pick;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick()}}});
  const chip=(n,id,dis)=>`<button type="button" ${id?`data-id="${esc(id)}"`:''} ${dis?'disabled':''} class="${id&&id===SEL?'on':''}" aria-pressed="${id===SEL}">${esc(n)}</button>`;
  $('#chips').innerHTML=DISTRICTS.map((D,zi)=>{const lock=LOCKED[D.d],its=Z[zi].items;
    const btns=lock?its.map(it=>chip(it.name,null,true)):its.filter(it=>it.id).map(it=>chip(it.name,it.id,false));
    return `<div><div class="gt">${esc(D.name)}・${esc(D.lim)}${lock?' 🔒':''}</div><div class="row">${btns.join('')||'<span class="empty" style="padding:0">即將開幕</span>'}</div></div>`}).join('');
  $('#chips').querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>{SEL=b.dataset.id;map();side();toSide()})}
async function load(){
  try{META=await fetch('town/meta.json').then(r=>r.json());
    CAT=await fetch('../dashboard/catalog.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json());
    GAMES=CAT.items.filter(i=>i.kind==='game');
    const sel=GAMES.find(g=>g.id===SEL);if(!sel||LOCKED[distOf(sel)])SEL=(GAMES.find(g=>!LOCKED[distOf(g)])||{}).id||null;
    map();side()}                                       /* map() 每次整個重畫 #map，不會疊加 */
  catch(e){$('#map').innerHTML='<div class="empty">載入失敗：請用 http(s) 開啟（'+esc(e.message)+'）</div>'}}
load();
</script>
</body>
</html>
