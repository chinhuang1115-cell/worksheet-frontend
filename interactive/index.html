<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>互動學習單</title>
<style>
:root{--L0:#3f8f8a;--L1:#2f4d6e;--L2:#5a86ad;--L3:#e9f1f9;--L3t:#2f4d6e;--rail:#a9c4de;--bg:#f6f5f2;--card:#fff;--ink:#2b3440;--mute:#6b7683;--line:#e3e0d9;--ac:#e8863a;--ac-soft:#fdf0e3}
@media (prefers-color-scheme:dark){:root{--L0:#3a8a86;--L1:#27405c;--L2:#4d7599;--L3:#2f3b4a;--L3t:#dbe7f3;--rail:#4d6a88;--bg:#1d2128;--card:#272c35;--ink:#e8eaee;--mute:#9aa4b1;--line:#3a414d;--ac:#f09a55;--ac-soft:#3a2e24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "芫荽","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
nav{background:var(--card);border-right:1px solid var(--line);padding:18px 12px 18px 48px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:19px;margin:0 0 2px;padding:0 8px}
.home{color:inherit;text-decoration:none}.home:hover{color:var(--ac)}
/* 階層配色（由外到內）：L0 網站＝青藍｜L1 互動學習單＝最深｜L2 主類＝深灰藍｜L3 次類＝淺灰藍；選中＝橘 */
.homebtn{display:block;text-align:center;text-decoration:none;background:var(--L1);color:#fff;border-radius:99px;padding:6px 0;margin:0 0 8px;font-weight:700}.homebtn:hover{filter:brightness(1.25)}
/* 連回網站：用青藍色塊，和總覽本身的橘色區分「這是離開總覽」 */
/* 左側邊緣直式標籤：切換到易數教室（不同網站層級，與導覽內的按鈕區隔） */
.edgetab{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:40;writing-mode:vertical-rl;background:var(--L0);color:#fff;text-decoration:none;font-weight:800;letter-spacing:.25em;padding:16px 8px;border-radius:0 12px 12px 0;box-shadow:2px 2px 8px rgba(0,0,0,.2);font-size:16px}.edgetab:hover{filter:brightness(1.12)}
.meta{color:var(--mute);font-size:12.5px;padding:0 8px 10px}
nav input[type=search]{width:100%;font:inherit;font-size:14px;padding:8px 14px;border:1px solid var(--line);border-radius:99px;background:var(--bg);color:var(--ink);margin-bottom:8px}
/* 主類：深色底，與次類（淺底、選中為橘）形成對比 */

.m{box-shadow:none;display:flex;justify-content:space-between;align-items:center;font-weight:800;padding:7px 12px;margin-top:12px;border:0;border-radius:10px;background:var(--L2);color:#fff;font-size:15px;width:100%;text-align:left;cursor:pointer;font-family:inherit}
.m:hover{filter:brightness(1.15)}
.m small{color:#ffe08a;font-weight:700}
/* 次類：縮排＋左側連接線，淺色底，表示隸屬於上方主類 */
.sub3{margin:2px 0 0 14px;padding-left:8px;border-left:4px solid var(--rail)}
.s{margin-top:3px;display:flex;justify-content:space-between;width:100%;border:0;background:var(--L3);font:inherit;font-weight:500;text-align:left;padding:7px 10px 7px 12px;border-radius:9px;color:var(--L3t);cursor:pointer}
.s:hover{filter:brightness(.95)}
.s span:last-child{color:#2a8a83;font-weight:800}.s .sfx{display:block;font-size:12.5px;font-weight:500;opacity:.85}.s.on{background:var(--ac);color:#fff;font-weight:800}.s.on span:last-child{color:#fff}@media (prefers-color-scheme:dark){.s span:last-child{color:#7fd1cb}.s.on span:last-child{color:#fff}}
.m.on{background:var(--ac)}.m.on small{color:#fff}
main{padding:20px 26px 60px;min-width:0}
.crumb{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:12.5px}
.bc{display:inline-block;text-decoration:none;border-radius:99px;padding:1px 11px;color:#fff;font-weight:700}.bc.l0{background:var(--L0)}.bc.l1{background:var(--L1)}.bc.l2{background:var(--L2)}.bc.l3{background:var(--ac)}.cs{color:var(--mute)}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h2{font-size:22px;margin:2px 0 0}
.chip{font:inherit;font-size:13px;padding:3px 13px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.facets{display:flex;gap:6px 20px;flex-wrap:wrap;margin:10px 0 16px}
.fgrp{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}.fn{color:var(--mute);font-size:13px;margin-right:2px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}      /* 固定三欄 */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.th{display:block;aspect-ratio:4/3;background:var(--ac-soft);border-bottom:1px solid var(--line);position:relative}
.th img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;padding:6px}
.th .code{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11.5px;padding:1px 9px;border-radius:99px}
.info{padding:10px 12px;display:flex;align-items:center;gap:8px;flex:1}
.t{flex:1;color:inherit;text-decoration:none;font-weight:700;line-height:1.35}
.cp{border:0;background:none;cursor:pointer;font-size:15px;opacity:.5;padding:2px 4px}.cp:hover{opacity:1}
.list .card{flex-direction:row;align-items:stretch}
.list .th{aspect-ratio:auto;width:110px;flex:none;border-bottom:0;border-right:1px solid var(--line)}
.sec{margin:0 0 22px}.sec h3{font-size:15px;margin:0 0 8px;color:var(--mute)}
.empty{color:var(--mute);padding:40px 0;text-align:center}
.toast{position:fixed;right:16px;bottom:16px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:640px){
 .wrap{grid-template-columns:1fr}
 nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
 .grid{gap:10px}
 main{padding:14px 12px 50px}.list .th{width:80px}
}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.list .card{flex-direction:column}.list .th{width:auto;aspect-ratio:4/3;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<a class="edgetab" href="../" title="回易數教室">易數教室</a>
<div class="wrap">
<nav>
  <h1><a class="home" href="#" data-home title="互動學習單首頁">互動學習單</a></h1>
  <div class="meta" id="meta">載入中…</div>
  <input type="search" id="q" placeholder="搜尋題型、單元、代碼">
  <div id="nav"></div>
</nav>
<main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script>
const FAMS=[['wordprob','加減'],['mul','乘法'],['coin','錢幣']];
const FAM_OF={wordprob:'wordprob',mul:'mul',mulwp:'mul',mulv:'mul',mulvc:'mul',dial:'mul',pv:'coin',cy:'coin'};
let CAT=null, q='', sel=localStorage.getItem('hub_sel')||'', list=localStorage.getItem('hub_view')==='list';   // sel：'fam:乘法主類 id' 或 次類 kind id；空＝第一個次類
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const navName=n=>{const m=/^(.+?)[_ ](.+)$/.exec(n);return m?`${m[1]}<small class="sfx">${m[2]}</small>`:n};      // 名稱的綴詞（底線或空格後）在導覽列另起一行
const kindName=id=>(CAT.kinds.find(k=>k.id===id)||{}).name||id;
const url=it=>CAT.backend+it.endpoint+'?'+(it.params?it.params+'&':'')+'lv=2&mode=faded';      // 從總覽進入一律弱提示（網址指定，優先於瀏覽器記住的難度）；進去後自行切換
// 小次類（頂端篩選）：由題型參數推得，不另存資料
const FACETS=['運算','位數','進位','難度','類別'];
let FSEL={};
function facets(it){
  const o=Object.fromEntries(new URLSearchParams(it.params||'')), f={};
  if(it.kind==='wordprob'){f['運算']={sub:'減法',add:'加法',mix:'加減交錯'}[o.op]; f['位數']=o.digits==='3'?'三位數':'兩位數'}
  if(it.kind==='mulv'||it.kind==='mulvc')f['進位']={none:'不進位',yes:'進位',mix:'交錯'}[o.regroup];
  if(['mul','mulwp','dial','pv'].includes(it.kind))f['難度']={easy:'簡單',normal:'一般'}[o.level];
  if(it.kind==='mulwp')f['類別']=/mul-concept/.test(it.endpoint)?'算數量':'算價錢';      // 乘法應用題 1*1 併入乘法概念後，用類別分「算數量／算價錢」（使用者 2026-10-17）
  return f;
}
const inSel=it=>sel.startsWith('fam:')?FAM_OF[it.kind]===sel.slice(4):it.kind===sel;
function textOK(it){const s=q.trim().toLowerCase(); if(!s)return true;
  return (it.title+it.paper+it.steps+it.note+it.endpoint+it.params+kindName(it.kind)+(FAMS.find(f=>f[0]===FAM_OF[it.kind])||[])[1]).toLowerCase().includes(s)}
function card(it){
  return `<div class="card"><a class="th" href="${url(it)}" target="_blank" rel="noopener" aria-label="開啟 ${esc(it.title)}">
    <img src="thumbs/${it.id}.webp" alt="" loading="lazy" onerror="this.remove()">${it.paper?`<span class="code">${esc(it.paper)}</span>`:''}</a>
   <div class="info"><a class="t" href="${url(it)}" target="_blank" rel="noopener">${esc(it.title)}</a>
   <button class="cp" data-copy="${esc(url(it))}" title="複製連結" aria-label="複製連結">🔗</button></div></div>`;
}
function render(){
  document.body.classList.toggle('list',list);
  const kinds=CAT.kinds.filter(k=>CAT.items.some(i=>i.kind===k.id));
  if(!sel||(!sel.startsWith('fam:')&&!kinds.some(k=>k.id===sel)))sel=kinds[0].id;
  $('#meta').textContent=`共 ${CAT.items.length} 個頁面・更新 ${CAT.updated}`;
  const cnt=id=>CAT.items.filter(i=>i.kind===id).length;
  $('#nav').innerHTML=FAMS.map(([fid,name])=>{const ks=kinds.filter(k=>FAM_OF[k.id]===fid);
    return `<button class="m ${sel==='fam:'+fid?'on':''}" data-sel="fam:${fid}">${name}<small>${ks.reduce((a,k)=>a+cnt(k.id),0)}</small></button>`+
    `<div class="sub3">`+ks.map(k=>`<button class="s ${sel===k.id?'on':''}" data-sel="${k.id}"><span>${navName(k.name)}</span><span>${cnt(k.id)}</span></button>`).join('')+`</div>`}).join('');
  const searching=!!q.trim();
  const scope=searching?CAT.items:CAT.items.filter(inSel);
  // 頂端篩選：只列目前範圍內有 2 種以上選項的小次類
  const fh=[];
  if(!searching)for(const n of FACETS){
    const vals=[...new Set(scope.map(i=>facets(i)[n]).filter(Boolean))];
    if(vals.length<2){delete FSEL[n];continue}
    if(FSEL[n]&&!vals.includes(FSEL[n]))delete FSEL[n];
    fh.push(`<span class="fgrp"><span class="fn">${n}</span>${['',...vals].map(v=>`<button class="chip ${(FSEL[n]||'')===v?'on':''}" data-fa="${n}" data-fv="${v}">${v||'全部'}</button>`).join('')}</span>`);
  } else FSEL={};
  const items=scope.filter(i=>textOK(i)&&(searching||FACETS.every(n=>!FSEL[n]||facets(i)[n]===FSEL[n])));
  const fam=sel.startsWith('fam:')?sel.slice(4):FAM_OF[sel], famName=(FAMS.find(f=>f[0]===fam)||[])[1];
  const title=searching?`搜尋「${esc(q.trim())}」`:sel.startsWith('fam:')?famName:kindName(sel);
  let body;
  if(!items.length)body='<div class="empty">沒有符合的互動頁</div>';
  else if(searching||sel.startsWith('fam:')){      // 跨次類：依次類分段
    body=kinds.filter(k=>items.some(i=>i.kind===k.id)).map(k=>`<div class="sec"><h3>${k.name}</h3><div class="grid">${items.filter(i=>i.kind===k.id).map(card).join('')}</div></div>`).join('');
  } else body=`<div class="grid">${items.map(card).join('')}</div>`;
  $('#main').innerHTML=`<div class="head"><div><div class="crumb"><a class="bc l1" href="#" data-home>互動學習單</a>${searching?'':`<span class="cs">›</span><a class="bc l2" href="#" data-sel="fam:${fam}">${famName}</a>`+(sel.startsWith('fam:')?'':`<span class="cs">›</span><span class="bc l3">${kindName(sel)}</span>`)}</div><h2>${title}</h2></div><span><button class="chip" id="view">${list?'縮圖':'清單'}</button></span></div>
    <div class="facets">${fh.join('')}</div>${body}`;
}
function goHome(){sel='';FSEL={};q='';$('#q').value='';try{localStorage.removeItem('hub_sel')}catch(_){}render();scrollTo(0,0)}      // 首頁＝總覽的預設畫面（第一個次類、無搜尋、無篩選）
document.addEventListener('click',e=>{
  if(e.target.closest('[data-home]')){e.preventDefault();goHome();return}
  const c=e.target.closest('[data-copy]'); if(c){const t=c.dataset.copy;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()});const m=$('#toast');m.textContent='已複製連結';m.classList.add('on');setTimeout(()=>m.classList.remove('on'),1600);return}
  const s=e.target.closest('[data-sel]'); if(s){sel=s.dataset.sel;FSEL={};q='';$('#q').value='';try{localStorage.setItem('hub_sel',sel)}catch(_){}render();scrollTo(0,0);return}
  const fa=e.target.closest('[data-fa]'); if(fa){FSEL[fa.dataset.fa]=fa.dataset.fv; render(); return}
  if(e.target.closest('#view')){list=!list;try{localStorage.setItem('hub_view',list?'list':'grid')}catch(_){}render()}
});
$('#q').addEventListener('input',e=>{q=e.target.value;render()});
window.addEventListener('focus',()=>CAT&&render());
async function load(){
  try{CAT=await fetch('../dashboard/catalog.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json());render()}
  catch(e){$('#main').innerHTML='<div class="empty">載入失敗：請用 http(s) 開啟（'+esc(e.message)+'）</div>'}
}
load(); setInterval(()=>{if(document.activeElement.id!=='q')load()},120000);
</script>
</body>
</html>
