<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>互動頁測試儀表板</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#2b3440;--mute:#6b7683;--line:#e3e0d9;--accent:#e8863a;--accent-soft:#fdf0e3;
--ok:#2e8b57;--ok-bg:#e4f4ea;--warn:#c98a00;--warn-bg:#fff4d6;--bad:#c8453b;--bad-bg:#fbe5e2;--none:#8a93a0;--none-bg:#eceef1}
@media (prefers-color-scheme:dark){:root{--bg:#1d2128;--card:#272c35;--ink:#e8eaee;--mute:#9aa4b1;--line:#3a414d;--accent:#f09a55;--accent-soft:#3a2e24;
--ok:#5fcf8f;--ok-bg:#1f3a2b;--warn:#f0c040;--warn-bg:#3b3318;--bad:#f07b72;--bad-bg:#40221f;--none:#9aa4b1;--none-bg:#323944}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "芫荽","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
header{padding:16px 20px 0;max-width:1280px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--mute);font-size:12.5px}
.sub b{color:var(--ink)}
nav{display:flex;gap:4px;margin-top:12px;border-bottom:2px solid var(--line);flex-wrap:wrap}
nav button{border:0;background:none;padding:10px 16px;font:inherit;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
nav button.on{color:var(--ink);border-color:var(--accent);font-weight:700}
main{max-width:1280px;margin:0 auto;padding:16px 20px 60px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input,.bar select,.btn{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.bar input[type=search]{min-width:200px;flex:1}
.btn{cursor:pointer}.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .n{font-size:26px;font-weight:700;line-height:1.1}.stat .l{font-size:12.5px;color:var(--mute)}
.prog{height:8px;border-radius:5px;background:var(--none-bg);overflow:hidden;display:flex;margin-top:6px}
.prog i{display:block;height:100%}
.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;white-space:nowrap}
.s-done,.s-pass{background:var(--ok-bg);color:var(--ok)}
.s-partial,.s-todo-w{background:var(--warn-bg);color:var(--warn)}
.s-none,.s-fail{background:var(--bad-bg);color:var(--bad)}
.s-na,.s-todo{background:var(--none-bg);color:var(--none)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.card>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card>summary::-webkit-details-marker{display:none}
.card>summary::before{content:"▸";color:var(--mute);transition:.15s}
.card[open]>summary::before{transform:rotate(90deg)}
.card .t{font-weight:700}.card .m{color:var(--mute);font-size:12.5px}
.card .body{padding:2px 14px 14px;border-top:1px solid var(--line)}
.sp{flex:1}
.lv{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
.lv h4{margin:0 0 6px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lv a.go{font-size:13px;color:#fff;background:var(--accent);padding:3px 12px;border-radius:99px;text-decoration:none}
.chk{display:flex;gap:7px;align-items:flex-start;font-size:13.5px;padding:2px 0}
.chk input{margin-top:5px}
.chk small{color:var(--mute)}
.stbtn{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stbtn button{border:0;background:var(--card);color:var(--mute);padding:4px 10px;font:inherit;font-size:13px;cursor:pointer;border-right:1px solid var(--line)}
.stbtn button:last-child{border:0}
.stbtn button.on.pass{background:var(--ok);color:#fff}.stbtn button.on.fail{background:var(--bad);color:#fff}.stbtn button.on.todo{background:var(--none);color:#fff}
textarea.note{width:100%;margin-top:6px;font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:34px}
table{border-collapse:collapse;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--accent-soft);font-size:12.5px;position:sticky;top:0}
td.c,th.c{text-align:center;white-space:nowrap}
.wrap{overflow-x:auto;border-radius:12px}
.gap{color:var(--bad);font-size:12.5px}.note{color:var(--mute);font-size:12.5px}
.lvtxt{font-size:12.5px}.lvtxt b{display:inline-block;min-width:3em}
h2{font-size:16px;margin:22px 0 8px}
pre{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;font-size:13px}
.toast{position:fixed;right:16px;bottom:16px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
.hint{background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}
@media (max-width:640px){main,header{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<header>
  <h1>互動頁測試儀表板</h1>
  <div class="sub" id="meta">載入中…</div><div class="sub"><a href="../interactive/" style="color:var(--accent)">← 互動學習單總覽（給學生／老師使用的入口）</a></div>
  <nav id="tabs"></nav>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>
<script>
const LS_KEY='dash_tests_v1', POLL_MS=60000;
let CAT=null, SPEC=null, STATE={}, TAB=localStorage.getItem('dash_tab')||'test';
const F={q:'',kind:'',level:'',st:''};
const OPEN=new Set();
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{STATE=JSON.parse(localStorage.getItem(LS_KEY)||'{}')}catch(e){STATE={}}}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(STATE))}catch(e){toast('無法寫入瀏覽器儲存，請改用匯出')}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}
const kindName=id=>(CAT.kinds.find(k=>k.id===id)||{}).name||id;
const lvName=id=>CAT.levels.find(l=>l.id==id);
const rowKey=(it,lv)=>it.id+'|'+lv;
const get=k=>STATE[k]||{st:'todo',checks:{},note:''};
function rowsOf(it){return [...CAT.levels.map(l=>({key:rowKey(it,l.id),lv:l.id,label:l.name+'（紙本：'+l.paper+'）'})),
  ...CAT.extraChecks.map((c,i)=>({key:rowKey(it,'x'+i),lv:'x',label:c}))]}
function expectations(it,lv){
  if(lv==='x')return [];
  return SPEC.features.filter(f=>f.levels&&f.kinds[it.kind]!=='na'&&f.levels[lv]).map(f=>({id:f.id,name:f.name,text:f.levels[lv],st:f.kinds[it.kind],status:f.status}))
}
function link(it,lv){const l=lvName(lv);return CAT.backend+it.endpoint+'?'+(it.params?it.params+'&':'')+(l?'lv='+l.id+'&mode='+l.mode:'mode=graded')}
function stat(rows){const c={pass:0,fail:0,todo:0};rows.forEach(r=>c[get(r.key).st]++);return c}
function bar(c){const t=c.pass+c.fail+c.todo||1;return `<div class="prog"><i style="width:${c.pass/t*100}%;background:var(--ok)"></i><i style="width:${c.fail/t*100}%;background:var(--bad)"></i></div>`}

/* ---------- tabs ---------- */
const TABS=[['test','逐項測試'],['spec','提示規格表'],['audit','規格盤點'],['adopt','新頁面套用']];
function renderTabs(){$('#tabs').innerHTML=TABS.map(([k,n])=>`<button class="${k===TAB?'on':''}" data-t="${k}">${n}</button>`).join('')}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;TAB=b.dataset.t;try{localStorage.setItem('dash_tab',TAB)}catch(_){}render()});

/* ---------- 逐項測試 ---------- */
function visibleItems(){
  const q=F.q.trim().toLowerCase();
  return CAT.items.filter(it=>{
    if(F.kind&&it.kind!==F.kind)return false;
    if(q&&!(it.title+it.endpoint+it.params+it.note+it.steps+kindName(it.kind)+it.paper).toLowerCase().includes(q))return false;
    if(F.st||F.level){
      return rowsOf(it).some(r=>(!F.level||String(r.lv)===F.level)&&(!F.st||get(r.key).st===F.st))
    }
    return true})
}
function renderTest(){
  const all=CAT.items.flatMap(rowsOf), c=stat(all);
  const byKind=CAT.kinds.map(k=>{const r=CAT.items.filter(i=>i.kind===k.id).flatMap(rowsOf),s=stat(r);return `<div class="stat"><div class="l">${k.name}</div><div class="n">${s.pass}<span style="font-size:14px;color:var(--mute)"> / ${r.length}</span></div>${bar(s)}${s.fail?`<div class="gap">有問題 ${s.fail}</div>`:''}</div>`}).join('');
  const items=visibleItems();
  $('#main').innerHTML=`
  <div class="grid"><div class="stat"><div class="l">全部測試項目</div><div class="n">${all.length}</div></div>
   <div class="stat"><div class="l">通過</div><div class="n" style="color:var(--ok)">${c.pass}</div>${bar(c)}</div>
   <div class="stat"><div class="l">有問題</div><div class="n" style="color:var(--bad)">${c.fail}</div></div>
   <div class="stat"><div class="l">未測</div><div class="n">${c.todo}</div></div></div>
  <div class="grid">${byKind}</div>
  <div class="hint">每個頁面依「強／弱／無提示」各一列＋裝置檢查。連結帶 <code>lv</code> 參數，開啟時直接是該難度（需後端 2026-10-14 之後的版本）；之後仍可用頁面右上角切換。勾選與備註存在這個瀏覽器；換裝置請用「匯出／匯入」。</div>
  <div class="bar">
   <input type="search" id="q" placeholder="搜尋題型、端點、參數…" value="${esc(F.q)}">
   <select id="fk"><option value="">全部題型</option>${CAT.kinds.map(k=>`<option value="${k.id}" ${F.kind===k.id?'selected':''}>${k.name}</option>`).join('')}</select>
   <select id="fl"><option value="">全部難度</option>${CAT.levels.map(l=>`<option value="${l.id}" ${F.level==l.id?'selected':''}>${l.name}</option>`).join('')}<option value="x" ${F.level==='x'?'selected':''}>裝置檢查</option></select>
   <select id="fs"><option value="">全部狀態</option><option value="todo" ${F.st==='todo'?'selected':''}>未測</option><option value="fail" ${F.st==='fail'?'selected':''}>有問題</option><option value="pass" ${F.st==='pass'?'selected':''}>通過</option></select>
   <span class="sp"></span>
   <button class="btn" id="exp">匯出 JSON</button><button class="btn" id="expc">匯出 CSV</button><button class="btn" id="imp">匯入</button>
   <button class="btn" id="clr">清空紀錄</button><input type="file" id="file" accept=".json" hidden>
  </div>
  ${items.length?items.map(itemCard).join(''):'<div class="note">沒有符合的項目</div>'}`;
  bindTest();
}
function itemCard(it){
  const rows=rowsOf(it),s=stat(rows);
  const sm=it.smoke?`<span class="pill s-done" title="後端 smoke_test 測項">smoke：${esc(it.smoke)}</span>`:`<span class="pill s-partial">smoke 未涵蓋</span>`;
  return `<details class="card" data-id="${it.id}" ${OPEN.has(it.id)?'open':''}><summary>
   <span class="t">${esc(it.title)}</span><span class="m">${kindName(it.kind)}${it.paper?'・紙本 '+it.paper:''}</span>
   <span class="sp"></span>${sm}<span class="pill s-pass">${s.pass}</span><span class="pill s-fail">${s.fail}</span><span class="pill s-todo">${s.todo}</span></summary>
   <div class="body"><div class="note" style="margin:8px 0 0">步驟：${esc(it.steps)}　<code>${esc(it.endpoint)}${it.params?'?'+esc(it.params):''}</code>${it.note?'　備註：'+esc(it.note):''}</div>
   ${rows.filter(r=>!F.level||String(r.lv)===F.level).map(r=>rowHtml(it,r)).join('')}</div></details>`}
function rowHtml(it,r){
  const g=get(r.key),ex=expectations(it,r.lv),isLv=r.lv!=='x';
  return `<div class="lv" data-key="${r.key}"><h4>${esc(r.label)}
   ${isLv?`<a class="go" href="${link(it,r.lv)}" target="_blank" rel="noopener">開啟 ↗</a>`:''}
   <span class="sp"></span>
   <span class="stbtn">${[['todo','未測'],['pass','通過'],['fail','有問題']].map(([v,n])=>`<button class="${v} ${g.st===v?'on':''}" data-st="${v}">${n}</button>`).join('')}</span></h4>
   ${ex.map(e=>`<label class="chk"><input type="checkbox" data-f="${e.id}" ${g.checks[e.id]?'checked':''}><span><b>${esc(e.name)}</b>：${esc(e.text)} ${e.st==='partial'||e.st==='none'?'<span class="pill s-partial" title="此項規格尚不完整，預期值僅供參考">規格待補</span>':''}</span></label>`).join('')}
   <textarea class="note" placeholder="備註（發現的問題、裝置、瀏覽器…）">${esc(g.note)}</textarea>
   ${g.ts?`<div class="note">最後更新：${esc(g.ts)}</div>`:''}</div>`}
function bindTest(){
  $('#q').oninput=e=>{F.q=e.target.value;const p=e.target.selectionStart;renderTest();const q=$('#q');q.focus();q.setSelectionRange(p,p)};
  $('#fk').onchange=e=>{F.kind=e.target.value;renderTest()};
  $('#fl').onchange=e=>{F.level=e.target.value;renderTest()};
  $('#fs').onchange=e=>{F.st=e.target.value;renderTest()};
  $('#exp').onclick=()=>download('interactive-test-results.json',JSON.stringify({exported:new Date().toISOString(),data:STATE},null,1),'application/json');
  $('#expc').onclick=exportCsv;
  $('#imp').onclick=()=>$('#file').click();
  $('#file').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());Object.assign(STATE,j.data||j);save();renderTest();toast('已匯入')}catch(_){toast('匯入失敗：不是有效的 JSON')}};
  $('#clr').onclick=()=>{if(confirm('確定清空這個瀏覽器的所有測試紀錄？（建議先匯出）')){STATE={};save();renderTest()}};
  document.querySelectorAll('details.card').forEach(d=>d.addEventListener('toggle',()=>{d.open?OPEN.add(d.dataset.id):OPEN.delete(d.dataset.id)}));
  document.querySelectorAll('.lv').forEach(box=>{
    const k=box.dataset.key;
    const touch=()=>{STATE[k]=STATE[k]||{st:'todo',checks:{},note:''};STATE[k].ts=new Date().toLocaleString('zh-TW',{hour12:false});return STATE[k]};
    box.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{touch().st=b.dataset.st;save();renderTest()});
    box.querySelectorAll('[data-f]').forEach(c=>c.onchange=()=>{const g=touch();g.checks[c.dataset.f]=c.checked;save()});
    box.querySelector('textarea').onchange=e=>{touch().note=e.target.value;save();renderTest()};
  });
}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function exportCsv(){
  const rows=[['題型','項目','難度／檢查','狀態','備註','更新時間']];
  CAT.items.forEach(it=>rowsOf(it).forEach(r=>{const g=get(r.key);rows.push([kindName(it.kind),it.title,r.label,{todo:'未測',pass:'通過',fail:'有問題'}[g.st],g.note,g.ts||''])}));
  download('interactive-test-results.csv','﻿'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv');
}

/* ---------- 提示規格表 ---------- */
const SL={done:'已規格化',partial:'部分／不一致',none:'未規格化',na:'不適用'};
function renderSpec(){
  const cats=[...new Set(SPEC.features.map(f=>f.cat))];
  const sel=F.sk||'';
  $('#main').innerHTML=`
  <div class="hint">${esc(SPEC.note)}<br>表格上半是「強／弱／無提示」各自該有的行為；右側色塊是各題型目前的規格化狀態。「—」＝此功能不分難度（三級相同）。</div>
  <div class="bar"><input type="search" id="sq" placeholder="搜尋功能…" value="${esc(F.sq||'')}"><select id="ss"><option value="">全部狀態</option>${['done','partial','none'].map(s=>`<option value="${s}" ${F.ss===s?'selected':''}>${SL[s]}</option>`).join('')}</select>
  <button class="btn" id="mdexp">複製為 Markdown</button></div>
  ${cats.map(c=>{const fs=SPEC.features.filter(f=>f.cat===c&&(!F.ss||f.status===F.ss)&&(!F.sq||(f.name+f.desc+f.note).includes(F.sq)));if(!fs.length)return '';
  return `<h2>${c}</h2><div class="wrap"><table><thead><tr><th style="min-width:190px">功能</th>${SPEC.levels.map(l=>`<th style="min-width:130px">${l.name}</th>`).join('')}<th class="c">狀態</th>${SPEC.kinds.map(k=>`<th class="c" style="font-size:11.5px">${k.name}</th>`).join('')}</tr></thead><tbody>${fs.map(f=>`<tr>
   <td><b>${esc(f.name)}</b> ${f.autotest?`<span class="pill ok" title="toolkit/test_hint_profile.py：${f.autotest.join('、')}">🧪 自動測試</span>`:''}${f.profile?`<span class="pill nn" title="hint-profile.json 的鍵">${esc(f.profile)}</span>`:''}<div class="note">${esc(f.desc)}</div>${f.note?`<div class="gap">${esc(f.note)}</div>`:''}${f.gap?`<div class="note">→ ${esc(f.gap)}</div>`:''}<div class="note">出處：${esc(f.source)}</div></td>
   ${f.levels?['3','2','1'].map(l=>`<td class="lvtxt">${esc(f.levels[l])}</td>`).join(''):`<td class="lvtxt note" colspan="3" style="text-align:center">— 不分難度 —</td>`}
   <td class="c"><span class="pill s-${f.status}">${SL[f.status]}</span></td>
   ${SPEC.kinds.map(k=>`<td class="c"><span class="pill s-${f.kinds[k.id]}" title="${SL[f.kinds[k.id]]}">${{done:'●',partial:'◐',none:'○',na:'—'}[f.kinds[k.id]]}</span></td>`).join('')}</tr>`).join('')}</tbody></table></div>`}).join('')}
  <div class="note" style="margin-top:8px">● 已規格化　◐ 部分／不一致　○ 未規格化　— 不適用</div>`;
  $('#sq').oninput=e=>{F.sq=e.target.value;const p=e.target.selectionStart;renderSpec();const q=$('#sq');q.focus();q.setSelectionRange(p,p)};
  $('#ss').onchange=e=>{F.ss=e.target.value;renderSpec()};
  $('#mdexp').onclick=()=>{copy(specMd());toast('已複製')};
}
function specMd(){
  let s='# 互動版提示規格表（'+SPEC.updated+'）\n\n| 功能 | 強提示 | 弱提示 | 無提示 | 狀態 |\n|---|---|---|---|---|\n';
  SPEC.features.forEach(f=>{s+=`| ${f.name} | ${f.levels?f.levels['3']:'（不分難度）'+f.desc} | ${f.levels?f.levels['2']:''} | ${f.levels?f.levels['1']:''} | ${SL[f.status]} |\n`});return s}
function copy(t){navigator.clipboard?navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t)):fallbackCopy(t)}
function fallbackCopy(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}

/* ---------- 規格盤點 ---------- */
function renderAudit(){
  const fs=SPEC.features,cnt=s=>fs.filter(f=>f.status===s).length;
  const gaps=fs.filter(f=>f.status!=='done');
  const kindRows=SPEC.kinds.map(k=>{const a=fs.filter(f=>f.kinds[k.id]!=='na'),c=s=>a.filter(f=>f.kinds[k.id]===s).length;return `<tr><td>${k.name}</td><td class="c">${a.length}</td><td class="c"><span class="pill s-done">${c('done')}</span></td><td class="c"><span class="pill s-partial">${c('partial')}</span></td><td class="c"><span class="pill s-none">${c('none')}</span></td></tr>`}).join('');
  $('#main').innerHTML=`
  <div class="grid"><div class="stat"><div class="l">功能總數</div><div class="n">${fs.length}</div></div>
   <div class="stat"><div class="l">已規格化</div><div class="n" style="color:var(--ok)">${cnt('done')}</div></div>
   <div class="stat"><div class="l">部分／有矛盾</div><div class="n" style="color:var(--warn)">${cnt('partial')}</div></div>
   <div class="stat"><div class="l">未規格化</div><div class="n" style="color:var(--bad)">${cnt('none')}</div></div></div>
  <h2>各題型的規格涵蓋</h2><div class="wrap"><table><thead><tr><th>題型</th><th class="c">適用功能數</th><th class="c">已規格化</th><th class="c">部分</th><th class="c">未規格化</th></tr></thead><tbody>${kindRows}</tbody></table></div>
  <h2>待補清單（${gaps.length}）</h2>
  <div class="wrap"><table><thead><tr><th>功能</th><th class="c">狀態</th><th>缺口／矛盾</th><th>建議動作</th><th class="c">新頁面</th></tr></thead><tbody>${gaps.sort((a,b)=>({none:0,partial:1}[a.status]-{none:0,partial:1}[b.status])||({must:0,should:1,opt:2}[a.adopt]-{must:0,should:1,opt:2}[b.adopt])).map(f=>`<tr><td><b>${esc(f.name)}</b><div class="note">${f.cat}</div></td><td class="c"><span class="pill s-${f.status}">${SL[f.status]}</span></td><td class="gap">${esc(f.note||'—')}</td><td>${esc(f.gap||'—')}</td><td class="c">${SPEC.adoptLegend[f.adopt]}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ---------- 新頁面套用 ---------- */
const AD=JSON.parse(localStorage.getItem('dash_adopt')||'null')||{};
function renderAdopt(){
  const fs=SPEC.features;
  const on=f=>(f.id in AD)?AD[f.id]:f.adopt==='must';
  $('#main').innerHTML=`<div class="hint">新建互動頁時，勾選要套用的功能，下方會產生可直接貼進需求／後端 session 的規格區塊（含強／弱／無提示各自的行為）。「新頁面必備」預設勾選；標示「規格待補」的功能請先在『規格盤點』決定標準。</div>
  <div class="bar"><input id="pn" placeholder="新頁面名稱（例：乘法扭蛋機）" style="flex:1;min-width:220px"><button class="btn pri" id="cp">複製規格區塊</button></div>
  <div class="wrap"><table><thead><tr><th class="c">套用</th><th>功能</th><th>新頁面</th><th>規格</th></tr></thead><tbody>${fs.map(f=>`<tr><td class="c"><input type="checkbox" data-a="${f.id}" ${on(f)?'checked':''}></td><td><b>${esc(f.name)}</b><div class="note">${esc(f.desc)}</div></td><td>${SPEC.adoptLegend[f.adopt]}</td><td><span class="pill s-${f.status}">${SL[f.status]}</span></td></tr>`).join('')}</tbody></table></div>
  <h2>預覽</h2><pre id="pv"></pre>`;
  const upd=()=>{const name=$('#pn').value||'（新頁面）';let s=`## 互動頁規格：${name}\n規格版本：${SPEC.updated}（dashboard/spec.json）\n\n`;
    fs.filter(on).forEach(f=>{s+=`- **${f.name}**${f.status!=='done'?'【規格待補】':''}：${f.desc}\n`;if(f.levels)s+=`  - 強：${f.levels['3']}\n  - 弱：${f.levels['2']}\n  - 無：${f.levels['1']}\n`});
    s+=`\n驗收：後端 smoke_test 新增測項＋Playwright 三種難度各跑一次；完成後更新 dashboard/catalog.json 與 spec.json。\n`;$('#pv').textContent=s;return s};
  document.querySelectorAll('[data-a]').forEach(c=>c.onchange=()=>{AD[c.dataset.a]=c.checked;try{localStorage.setItem('dash_adopt',JSON.stringify(AD))}catch(_){}upd()});
  $('#pn').oninput=upd;$('#cp').onclick=()=>{copy(upd());toast('已複製')};upd();
}

/* ---------- 資料載入與自動更新 ---------- */
function render(){renderTabs();$('#meta').innerHTML=`資料更新：<b>${CAT.updated}</b>（規格 ${SPEC.updated}）・後端 commit <b>${CAT.backendCommit}</b>・${CAT.items.length} 個頁面變體・每分鐘自動檢查更新 <span id="live"></span>`;
  ({test:renderTest,spec:renderSpec,audit:renderAudit,adopt:renderAdopt})[TAB]()}
let sig='';
async function fetchData(first){
  try{
    const [a,b]=await Promise.all([fetch('catalog.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()),fetch('spec.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json())]);
    const s=JSON.stringify(a).length+':'+JSON.stringify(b).length+':'+a.updated+b.updated+JSON.stringify(a.items.map(i=>i.id))+JSON.stringify(b.features.map(f=>f.status+f.id));
    if(s!==sig){const changed=sig!=='';sig=s;CAT=a;SPEC=b;if(first||!active())render();else{render()}if(changed)toast('清單／規格已更新')}
    const l=$('#live');if(l)l.textContent='・最後檢查 '+new Date().toLocaleTimeString('zh-TW',{hour12:false});
  }catch(e){if(first)$('#main').innerHTML='<div class="gap">載入失敗：請用 http(s) 開啟（直接開檔案無法讀取 JSON）。'+esc(e.message)+'</div>'}
}
const active=()=>document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
load();
fetchData(true);
setInterval(()=>{if(!active())fetchData(false)},POLL_MS);
</script>
</body>
</html>
